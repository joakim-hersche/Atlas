[project]
name = "gemeindebank"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "geopandas>=1.2.0",
    "networkx>=3.7",
    "numba>=0.68.1",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyogrio>=0.13.0",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "shapely>=2.2.0",
    "xlrd>=2.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["pipeline/tests"]
