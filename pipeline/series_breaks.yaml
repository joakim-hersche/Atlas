    note_en: "The 4th revision of the unemployment insurance law (LACI/AVIG) affected the number of registered unemployed in April–October 2011 (OCSTAT)."
    note_de: "Die 4. Revision des Arbeitslosenversicherungsgesetzes (AVIG) beeinflusste die Zahl der registrierten Arbeitslosen von April bis Oktober 2011 (OCSTAT)."
    note_fr: "La 4e révision de la loi sur l’assurance-chômage (LACI) a affecté le nombre de chômeurs inscrits d’avril à octobre 2011 (OCSTAT)."
    evidence:
      - url: https://statistique.ge.ch/tel/domaines/03/03_03/T_03_03_4_01.xlsx
        file: data/raw/kt_unemployment/*/T_03_03_4_01.xlsx
        quote: "affecte le nombre de chômeurs inscrits et arrivés en fin de droit entre les mois d'avril et octobre 2011."

  - id: unemployment_ge_liasi_2012
    period: "2012"
    metrics: [unemp_registered]
    cantons: [GE]
    note_en: "GE: the new cantonal social assistance law (LIASI) of February 2012 makes some year-on-year comparisons difficult (OCSTAT)."
    note_de: "GE: Das neue kantonale Sozialhilfegesetz (LIASI) vom Februar 2012 erschwert manche Vergleiche zwischen Jahren (OCSTAT)."
    note_fr: "GE : l’introduction de la LIASI au 1er février 2012 rend certaines comparaisons annuelles délicates (OCSTAT)."
    evidence:
