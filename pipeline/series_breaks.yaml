    evidence:
      - url: https://statistique.ge.ch/tel/domaines/03/03_03/T_03_03_4_01.xlsx
        file: data/raw/kt_unemployment/*/T_03_03_4_01.xlsx
        quote: "Dès mars 2018, la répartition des demandeurs d'emploi en chômeurs et non-chômeurs est modifiée à la suite de l'uniformisation au niveau national de la"

  # ------------------------------------------------------------------ energy (Energie Reporter, from the connector's notes)
  - id: energie_reporter_steps
    from_note:
      source: bfe_energy
      regex: "^series break at the publisher: national total ([+-]\\d+) % against the previous month"
