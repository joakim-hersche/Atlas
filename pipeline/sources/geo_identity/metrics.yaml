# Area (swissBOUNDARIES3D 2026-01) and elevation (BFS G1) per municipality, reference state.
# Area figures are repeated for every STATPOP year (2010–2025) and 2026 so that density can be
# computed per year; the territory is the reference territory throughout (decision D16).
- {id: geo_area_total_ha, theme: Geography & identity, label_en: "Total area incl. lakes", label_de: "Gesamtfläche inkl. Seen", unit: ha, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, include_pseudo: true, description: "Municipality: area inside the municipal boundary including its share of lakes (swissBOUNDARIES3D gem_flaeche). Canton and Switzerland: the whole territory, including lake areas and state forest that belong to no municipality (e.g. most of Lake Neuchâtel, Lake Thun, Lake Constance; BFS codes 9xxx) and the two Ticino Kommunanzen, so the totals equal the official canton areas. For a land figure use Land area.", source_note: "swissBOUNDARIES3D tlm_hoheitsgebiet: Gemeindegebiet plus Kantonsgebiet/Kommunanz units (pseudo-units, added to canton and Swiss sums)."}
- {id: geo_area_lake_ha, theme: Geography & identity, label_en: "Lake area", label_de: "Seefläche", unit: ha, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, include_pseudo: true, description: "Municipality: lake area inside the municipal boundary (swissBOUNDARIES3D see_flaeche). Many large lakes belong to no municipality (cantonal lake areas), so a lakeside municipality can have 0 here (e.g. Thalwil, Küsnacht). Canton and Switzerland: all lakes, including those outside municipalities.", source_note: "Cantonal lake areas outside municipalities (Switzerland: 445 of 1,295 km²) are pseudo-units added to canton and Swiss sums."}
- {id: geo_area_land_ha, theme: Geography & identity, label_en: "Land area (without lakes)", label_de: "Landfläche (ohne Seen)", unit: ha, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, include_pseudo: true, description: "Total area minus lake area (swissBOUNDARIES3D gem_flaeche − see_flaeche). The area to quote for a place (Lausanne: 41.4 km²); population density uses it. Canton and Switzerland include land outside municipalities (Ticino Kommunanzen, Staatswald Galm)."}
- {id: geo_elev_mean, theme: Geography & identity, label_en: Mean elevation, label_de: Mittlere Höhe, unit: m a.s.l., decimals: 0, direction: neutral, aggregation: "weighted_mean:geo_area_total_ha", kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Mean terrain elevation over the municipal territory (BFS G1 Z_AVG, version valid on the reference date). Higher levels: area-weighted mean."}
- {id: geo_elev_median, theme: Geography & identity, label_en: Median elevation, label_de: Medianhöhe, unit: m a.s.l., decimals: 0, direction: neutral, aggregation: not_aggregatable, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Median terrain elevation (BFS G1 Z_MED)."}
- {id: geo_elev_min, theme: Geography & identity, label_en: Lowest point, label_de: Tiefster Punkt, unit: m a.s.l., decimals: 0, direction: neutral, aggregation: not_aggregatable, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Lowest terrain elevation (BFS G1 Z_MIN)."}
- {id: geo_elev_max, theme: Geography & identity, label_en: Highest point, label_de: Höchster Punkt, unit: m a.s.l., decimals: 0, direction: neutral, aggregation: not_aggregatable, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Highest terrain elevation (BFS G1 Z_MAX)."}
# derived
- {id: geo_pop_density, theme: Geography & identity, label_en: Population density, label_de: Bevölkerungsdichte, unit: persons per km² land area, decimals: 0, direction: neutral, aggregation: "ratio:pop_total/geo_area_land_ha*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde, description: "Permanent resident population (STATPOP) per km² of land area (swissBOUNDARIES3D, without lakes)."}
- {id: geo_lake_share, theme: Geography & identity, label_en: "Lake share of the area", label_de: "Seeanteil an der Fläche", unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:geo_area_lake_ha/geo_area_total_ha*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde, description: "Lake area inside the municipal boundary as a share of the total area inside it. Not comparable across lakes: on some lakes the water is divided among the lakeside municipalities (Lake Geneva: Lausanne 38.8 %), on others it belongs to the canton and to no municipality (Lake Zurich, Lake Neuchâtel: lakeside municipalities 0 %). Canton and Switzerland: all lakes / total area.", note_from: geo_area_lake_ha}
