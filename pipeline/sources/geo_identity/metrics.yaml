# Area (swissBOUNDARIES3D 2026-01) and elevation (BFS G1) per municipality, reference state.
# Area figures are repeated for every STATPOP year (2010–2025) and 2026 so that density can be
# computed per year; the territory is the reference territory throughout (decision D16).
- {id: geo_area_total_ha, theme: Geography & identity, label_en: Total area, label_de: Gesamtfläche, unit: ha, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Area of the municipality including its share of lakes (swissBOUNDARIES3D gem_flaeche).", source_note: "Lake areas and state forest not assigned to any municipality (e.g. parts of Lake Geneva, Lake Constance, Staatswald Galm) and the two Ticino Kommunanzen are not in any municipality, so municipal sums are below the published canton/Swiss totals (Switzerland: 40,840 vs 41,291 km²)."}
- {id: geo_area_lake_ha, theme: Geography & identity, label_en: Lake area, label_de: Seefläche, unit: ha, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Lake share of the municipal area (swissBOUNDARIES3D see_flaeche).", source_note: "Lake areas outside municipalities are only in the canton/Swiss totals."}
- {id: geo_area_land_ha, theme: Geography & identity, label_en: Land area, label_de: Landfläche, unit: ha, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Total area minus lake area (swissBOUNDARIES3D gem_flaeche − see_flaeche)."}
- {id: geo_elev_mean, theme: Geography & identity, label_en: Mean elevation, label_de: Mittlere Höhe, unit: m a.s.l., decimals: 0, direction: neutral, aggregation: "weighted_mean:geo_area_total_ha", kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Mean terrain elevation over the municipal territory (BFS G1 Z_AVG, version valid on the reference date). Higher levels: area-weighted mean."}
- {id: geo_elev_median, theme: Geography & identity, label_en: Median elevation, label_de: Medianhöhe, unit: m a.s.l., decimals: 0, direction: neutral, aggregation: not_aggregatable, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Median terrain elevation (BFS G1 Z_MED)."}
- {id: geo_elev_min, theme: Geography & identity, label_en: Lowest point, label_de: Tiefster Punkt, unit: m a.s.l., decimals: 0, direction: neutral, aggregation: not_aggregatable, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Lowest terrain elevation (BFS G1 Z_MIN)."}
- {id: geo_elev_max, theme: Geography & identity, label_en: Highest point, label_de: Höchster Punkt, unit: m a.s.l., decimals: 0, direction: neutral, aggregation: not_aggregatable, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Highest terrain elevation (BFS G1 Z_MAX)."}
# derived
- {id: geo_pop_density, theme: Geography & identity, label_en: Population density, label_de: Bevölkerungsdichte, unit: persons per km² land area, decimals: 0, direction: neutral, aggregation: "ratio:pop_total/geo_area_land_ha*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde, description: "Permanent resident population (STATPOP) per km² of land area (swissBOUNDARIES3D, without lakes)."}
- {id: geo_lake_share, theme: Geography & identity, label_en: Lake share of area, label_de: Seeanteil, unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:geo_area_lake_ha/geo_area_total_ha*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
