# BAFU modelled annual mean air pollution, population-weighted per municipality (STATPOP hectares
# of the same year). Limits: Ordinance on Air Pollution Control (LRV) annual limits as stated in the
# BAFU collection descriptions (data.geo.admin.ch): NO2 30, PM10 20, PM2.5 10 µg/m³.
- {id: air_hectare_residents, theme: Environment & hazards, label_en: Residents in the hectare grid, label_de: Einwohner im Hektarraster, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "STATPOP hectare residents assigned to the municipality (hectare centre in the reference polygon, else nearest within 500 m); denominator of the air exposure shares. Slightly above the permanent resident population because the hectare grid counts all residents (BBTOT)."}
- {id: air_no2_pop, theme: Environment & hazards, label_en: NO₂ exposure (population-weighted annual mean), label_de: NO₂-Belastung (bevölkerungsgewichtetes Jahresmittel), unit: µg/m³, decimals: 1, direction: lower_better, aggregation: "weighted_mean:air_hectare_residents", kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Annual mean NO₂ concentration (BAFU model map) averaged over the populated hectares, weighted by residents. Years 2010, 2015, 2020, 2025.", source_note: "200 m grid up to 2019, 20 m from 2020 (averaged to 100 m); BAFU: individual pixels should not be used to evaluate individual locations."}
- {id: air_no2_above_limit_residents, theme: Environment & hazards, label_en: Residents above the NO₂ limit, label_de: Einwohner über dem NO₂-Grenzwert, unit: persons, decimals: 0, direction: lower_better, aggregation: sum, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Residents in hectares with modelled annual mean NO₂ above 30 µg/m³ (LRV annual limit)."}
- {id: air_pm10_pop, theme: Environment & hazards, label_en: PM10 exposure (population-weighted annual mean), label_de: PM10-Belastung (bevölkerungsgewichtetes Jahresmittel), unit: µg/m³, decimals: 1, direction: lower_better, aggregation: "weighted_mean:air_hectare_residents", kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Annual mean PM10 concentration (BAFU model map), population-weighted. Years 2010, 2015, 2020, 2025.", source_note: "200 m grid up to 2019, 100 m from 2020."}
- {id: air_pm10_above_limit_residents, theme: Environment & hazards, label_en: Residents above the PM10 limit, label_de: Einwohner über dem PM10-Grenzwert, unit: persons, decimals: 0, direction: lower_better, aggregation: sum, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Residents in hectares with modelled annual mean PM10 above 20 µg/m³ (LRV annual limit)."}
- {id: air_pm25_pop, theme: Environment & hazards, label_en: PM2.5 exposure (population-weighted annual mean), label_de: PM2.5-Belastung (bevölkerungsgewichtetes Jahresmittel), unit: µg/m³, decimals: 1, direction: lower_better, aggregation: "weighted_mean:air_hectare_residents", kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Annual mean PM2.5 concentration (BAFU model map, 100 m), population-weighted. Years 2015, 2020, 2025."}
- {id: air_pm25_above_limit_residents, theme: Environment & hazards, label_en: Residents above the PM2.5 limit, label_de: Einwohner über dem PM2.5-Grenzwert, unit: persons, decimals: 0, direction: lower_better, aggregation: sum, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Residents in hectares with modelled annual mean PM2.5 above 10 µg/m³ (LRV annual limit)."}
# derived
- {id: air_no2_above_limit_share, theme: Environment & hazards, label_en: Residents above the NO₂ limit (share), label_de: Anteil Einwohner über dem NO₂-Grenzwert, unit: "% of residents", decimals: 1, direction: lower_better, aggregation: "ratio:air_no2_above_limit_residents/air_hectare_residents*100", kind: derived, precision: modelled, coverage: national, native_level: gemeinde}
- {id: air_pm10_above_limit_share, theme: Environment & hazards, label_en: Residents above the PM10 limit (share), label_de: Anteil Einwohner über dem PM10-Grenzwert, unit: "% of residents", decimals: 1, direction: lower_better, aggregation: "ratio:air_pm10_above_limit_residents/air_hectare_residents*100", kind: derived, precision: modelled, coverage: national, native_level: gemeinde}
- {id: air_pm25_above_limit_share, theme: Environment & hazards, label_en: Residents above the PM2.5 limit (share), label_de: Anteil Einwohner über dem PM2.5-Grenzwert, unit: "% of residents", decimals: 1, direction: lower_better, aggregation: "ratio:air_pm25_above_limit_residents/air_hectare_residents*100", kind: derived, precision: modelled, coverage: national, native_level: gemeinde}
