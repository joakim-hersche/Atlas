source_id: bazl_aircraft_noise
title: Population exposure to civil aircraft noise per municipality (FOCA/BAZL noise cadastre of civil aerodromes)
publisher: "BAZL / FOCA (Federal Office of Civil Aviation) via data.geo.admin.ch; buildings from BFS GWR, residents from BFS STATPOP"
url: https://data.geo.admin.ch/api/stac/v1/collections/ch.bazl.laermbelastungskataster-zivilflugplaetze
license: "Open use, source must be provided: the STAC collection (producer and licensor FOCA) links https://opendata.swiss/en/terms-of-use/#terms_by (terms_by), the same terms as the cleared BAFU sonBASE grids (bafu_noise); checked 2026-11-10"
attribution: "Source: FOCA/BAZL, Lärmbelastungskataster der Zivilflugplätze (2025); buildings: BFS GWR; residents: BFS STATPOP; exposure computed by ATLAS"
vintage: "Cadastre item of 2025-04-28 (collection updated 2025-12-11); curves valid from 2009 (Genève, Basel-Mulhouse) to 2024 (St. Gallen-Altenrhein), Zürich calculation of 11 January 2013 (EMPA, valid from 2015); residents STATPOP 2021 hectares; buildings of the GWR extract built up to 2021; municipalities of the reference state"
years: "2021 (residents); noise curves of the dates above"
method: "pipeline/sources/bazl_aircraft_noise/parse.py: closed isolines of 60 dB(A) (day Lr 06-22 h) and 55 dB(A) (first night hour Lr 22-23 h) turned into polygons per aerodrome; residents of each STATPOP hectare distributed over its GWR residential buildings by dwellings (as in bafu_noise); a building counts as exposed when its coordinate is inside a polygon"
precision: modelled
coverage: "partial: the eight aerodromes of the cadastre in the layer (Zürich, Genève, Basel-Mulhouse, Bern, Lugano-Agno, Saanen, Samedan, St. Gallen-Altenrhein); values for the municipalities of ZH, GE, BE, TI, GR, SG, BS"
notes: "FOCA: the cadastre is an inventory of the noise situation without direct legal effect on property owners. Limit values: canton Zürich (https://www.zh.ch/de/umwelt-tiere/laerm-schall/fluglaerm.html, read 2026-11-10): 'Die AGL umfasst das Gebiet mit bestehender und zukünftig möglicher Fluglärmbelastung über dem Immissionsgrenzwert der Empfindlichkeitsstufe II, das heisst Gebiete mit einer Lärmbelastung von mehr als 60 Dezibel am Tag oder 55 Dezibel in der Nacht (oder beides).' The Annex 5 LSV text itself (fedlex.admin.ch, bazl.admin.ch) was not reachable from the build environment; the 50 dB(A) of the second and last night hour is therefore not used. The IGW is applied to all aerodromes alike; Annex 5 may set other values for small aircraft aerodromes (to be confirmed). The Lugano-Agno night curves are marked 'shifted by -9 dB(A)' in the cadastre origin field and used as published. Basel-Mulhouse lies in France; its curves have a single 60 dB(A) day and 55 dB(A) night curve and fall outside Swiss residential areas."
catalog_ids: [bazl_aircraft_noise_cadastre]
