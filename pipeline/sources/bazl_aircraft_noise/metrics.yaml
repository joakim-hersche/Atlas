# Population exposure to civil aircraft noise (FOCA/BAZL noise cadastre curves, GWR buildings, STATPOP 2021 hectares). Modelled, partial coverage.
# Limits: immission limit values (IGW) of Annex 5 LSV, sensitivity level II: 60 dB(A) day (06-22 h), 55 dB(A) first night hour (zh.ch, 'Fluglärm').
- {id: "aircraft_noise_residents", label_en: "Residents in the aircraft noise calculation (hectare grid)", label_de: "Einwohner in der Fluglärmberechnung (Hektarraster)", description: "STATPOP 2021 hectare residents assigned to the municipality: the base of the aircraft noise shares. Modelled by ATLAS: each populated STATPOP 2021 hectare spreads its residents over the residential buildings of the GWR in proportion to their dwellings; a resident counts as exposed when the building coordinate lies inside the closed noise exposure curve of that level of an aerodrome in the FOCA/BAZL cadastre. Cadastre curves differ by aerodrome in date and basis (Zürich: EMPA calculation of 2013, valid from 2015; Genève and Basel-Mulhouse: valid from 2009) and are an inventory without direct legal effect, not the official count of people above the limit values. Covers the eight aerodromes in the cadastre only (Zürich, Genève, Basel-Mulhouse, Bern, Lugano-Agno, Saanen, Samedan, St. Gallen-Altenrhein), values only for the municipalities of cantons ZH, GE, BE, TI, GR, SG and BS; other aerodromes and military airfields are not covered.", source_note: "BAZL noise cadastre of civil aerodromes (geo.admin.ch, 2025), GWR (BFS), STATPOP 2021 hectares (BFS)", theme: "Environment & hazards", unit: "persons", decimals: 0, direction: "neutral", aggregation: "sum", kind: "base", precision: "exact", coverage: "partial:ZH,GE,BE,TI,GR,SG,BS", native_level: "gemeinde"}
- {id: "aircraft_day_60_residents", label_en: "Residents within the aircraft noise curve of 60 dB(A) by day", label_de: "Einwohner innerhalb der Fluglärmkurve von 60 dB(A) tagsüber", description: "Residents of buildings inside the modelled curve of 60 dB(A) (Lr, 06-22 h, all aircraft), the immission limit value (IGW) of sensitivity level II (residential zones) of Annex 5 of the Noise Abatement Ordinance (LSV). Modelled by ATLAS: each populated STATPOP 2021 hectare spreads its residents over the residential buildings of the GWR in proportion to their dwellings; a resident counts as exposed when the building coordinate lies inside the closed noise exposure curve of that level of an aerodrome in the FOCA/BAZL cadastre. Cadastre curves differ by aerodrome in date and basis (Zürich: EMPA calculation of 2013, valid from 2015; Genève and Basel-Mulhouse: valid from 2009) and are an inventory without direct legal effect, not the official count of people above the limit values. Covers the eight aerodromes in the cadastre only (Zürich, Genève, Basel-Mulhouse, Bern, Lugano-Agno, Saanen, Samedan, St. Gallen-Altenrhein), values only for the municipalities of cantons ZH, GE, BE, TI, GR, SG and BS; other aerodromes and military airfields are not covered.", source_note: "BAZL noise cadastre of civil aerodromes (geo.admin.ch, 2025), GWR (BFS), STATPOP 2021 hectares (BFS)", theme: "Environment & hazards", unit: "persons", decimals: 0, direction: "lower_better", aggregation: "sum", kind: "base", precision: "modelled", coverage: "partial:ZH,GE,BE,TI,GR,SG,BS", native_level: "gemeinde"}
- {id: "aircraft_night_55_residents", label_en: "Residents within the aircraft noise curve of 55 dB(A) in the first night hour", label_de: "Einwohner innerhalb der Fluglärmkurve von 55 dB(A) in der ersten Nachtstunde", description: "Residents of buildings inside the modelled curve of 55 dB(A) (Lr, 22-23 h), the night limit value of sensitivity level II for the first night hour. Cadastre night curves exist for Zürich, Genève, Basel-Mulhouse, Bern and Lugano-Agno only. Modelled by ATLAS: each populated STATPOP 2021 hectare spreads its residents over the residential buildings of the GWR in proportion to their dwellings; a resident counts as exposed when the building coordinate lies inside the closed noise exposure curve of that level of an aerodrome in the FOCA/BAZL cadastre. Cadastre curves differ by aerodrome in date and basis (Zürich: EMPA calculation of 2013, valid from 2015; Genève and Basel-Mulhouse: valid from 2009) and are an inventory without direct legal effect, not the official count of people above the limit values. Covers the eight aerodromes in the cadastre only (Zürich, Genève, Basel-Mulhouse, Bern, Lugano-Agno, Saanen, Samedan, St. Gallen-Altenrhein), values only for the municipalities of cantons ZH, GE, BE, TI, GR, SG and BS; other aerodromes and military airfields are not covered.", source_note: "BAZL noise cadastre of civil aerodromes (geo.admin.ch, 2025), GWR (BFS), STATPOP 2021 hectares (BFS)", theme: "Environment & hazards", unit: "persons", decimals: 0, direction: "lower_better", aggregation: "sum", kind: "base", precision: "modelled", coverage: "partial:ZH,GE,BE,TI,GR,SG,BS", native_level: "gemeinde"}
- {id: "aircraft_igw2_residents", label_en: "Residents within the aircraft noise curves at or above the level-II limits", label_de: "Einwohner innerhalb der Fluglärmkurven ab den Grenzwerten der Empfindlichkeitsstufe II", description: "Residents of buildings inside the 60 dB(A) day curve or the 55 dB(A) first-night-hour curve (or both), the definition the canton of Zürich gives for the limit line (AGL) of Zürich airport. Modelled by ATLAS: each populated STATPOP 2021 hectare spreads its residents over the residential buildings of the GWR in proportion to their dwellings; a resident counts as exposed when the building coordinate lies inside the closed noise exposure curve of that level of an aerodrome in the FOCA/BAZL cadastre. Cadastre curves differ by aerodrome in date and basis (Zürich: EMPA calculation of 2013, valid from 2015; Genève and Basel-Mulhouse: valid from 2009) and are an inventory without direct legal effect, not the official count of people above the limit values. Covers the eight aerodromes in the cadastre only (Zürich, Genève, Basel-Mulhouse, Bern, Lugano-Agno, Saanen, Samedan, St. Gallen-Altenrhein), values only for the municipalities of cantons ZH, GE, BE, TI, GR, SG and BS; other aerodromes and military airfields are not covered.", source_note: "BAZL noise cadastre of civil aerodromes (geo.admin.ch, 2025), GWR (BFS), STATPOP 2021 hectares (BFS)", theme: "Environment & hazards", unit: "persons", decimals: 0, direction: "lower_better", aggregation: "sum", kind: "base", precision: "modelled", coverage: "partial:ZH,GE,BE,TI,GR,SG,BS", native_level: "gemeinde"}
