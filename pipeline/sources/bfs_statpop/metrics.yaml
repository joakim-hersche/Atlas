# STATPOP metrics. kind: base = delivered by ingest.py; derived = computed per level by the build.
# Permanent resident population at 31 December.
- {id: pop_total, theme: Population & demography, label_en: Population, label_de: Ständige Wohnbevölkerung, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde}
- {id: pop_male, theme: Population & demography, label_en: Men, label_de: Männer, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde}
- {id: pop_female, theme: Population & demography, label_en: Women, label_de: Frauen, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde}
- {id: pop_swiss, theme: Migration & nationality, label_en: Swiss citizens, label_de: Schweizer Staatsangehörige, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde}
- {id: pop_foreign, theme: Migration & nationality, label_en: Foreign nationals, label_de: Ausländische Staatsangehörige, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde}
- {id: pop_nonpermanent, theme: Migration & nationality, label_en: Non-permanent residents, label_de: Nichtständige Wohnbevölkerung, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde}
- {id: pop_age_0_19, theme: Population & demography, label_en: Aged 0–19, label_de: 0–19 Jahre, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde}
- {id: pop_age_20_64, theme: Population & demography, label_en: Aged 20–64, label_de: 20–64 Jahre, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde}
- {id: pop_age_65_79, theme: Population & demography, label_en: Aged 65–79, label_de: 65–79 Jahre, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde}
- {id: pop_age_80plus, theme: Population & demography, label_en: Aged 80+, label_de: 80 Jahre und älter, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde}
- {id: pop_single, theme: Households & family, label_en: Single (never married), label_de: Ledig, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde}
- {id: pop_married, theme: Households & family, label_en: Married / registered partnership, label_de: Verheiratet / eingetragene Partnerschaft, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde}
- {id: pop_widowed, theme: Households & family, label_en: Widowed, label_de: Verwitwet, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde}
- {id: pop_divorced, theme: Households & family, label_en: Divorced, label_de: Geschieden, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde}
# derived
- {id: share_foreign, theme: Migration & nationality, label_en: Foreign nationals (share), label_de: Ausländeranteil, unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:pop_foreign/pop_total*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
- {id: share_age_0_19, theme: Population & demography, label_en: Share aged 0–19, label_de: Anteil 0–19-Jährige, unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:pop_age_0_19/pop_total*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
- {id: share_age_65plus, theme: Population & demography, label_en: Share aged 65+, label_de: Anteil 65-Jährige und Ältere, unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:pop_age_65_79+pop_age_80plus/pop_total*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
- {id: share_age_80plus, theme: Population & demography, label_en: Share aged 80+, label_de: Anteil 80-Jährige und Ältere, unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:pop_age_80plus/pop_total*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
- {id: old_age_dependency, theme: Population & demography, label_en: Old-age dependency ratio, label_de: Altersquotient, unit: "65+ per 100 aged 20–64", decimals: 1, direction: neutral, aggregation: "ratio:pop_age_65_79+pop_age_80plus/pop_age_20_64*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
- {id: youth_dependency, theme: Population & demography, label_en: Youth dependency ratio, label_de: Jugendquotient, unit: "0–19 per 100 aged 20–64", decimals: 1, direction: neutral, aggregation: "ratio:pop_age_0_19/pop_age_20_64*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
- {id: share_women, theme: Population & demography, label_en: Share of women, label_de: Frauenanteil, unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:pop_female/pop_total*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
- {id: share_married, theme: Households & family, label_en: Married (share of residents aged 20+), label_de: Anteil Verheiratete (ab 20 Jahren), unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:pop_married/pop_age_20_64+pop_age_65_79+pop_age_80plus*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde, description: "Married residents (incl. registered partnerships as STATPOP counts them) as a share of residents aged 20 and over, so that the share does not fall with the number of children (audit round 2). The few married residents under 20 are in the numerator."}
- {id: share_divorced, theme: Households & family, label_en: Divorced (share of residents), label_de: Anteil Geschiedene, unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:pop_divorced/pop_total*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
- {id: pop_change_1y, theme: Population & demography, label_en: Population change (1 year), label_de: Bevölkerungsveränderung (1 Jahr), unit: "%", decimals: 1, direction: neutral, aggregation: "change:pop_total:1", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
- {id: pop_change_5y, theme: Population & demography, label_en: Population change (5 years), label_de: Bevölkerungsveränderung (5 Jahre), unit: "%", decimals: 1, direction: neutral, aggregation: "change:pop_total:5", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
- {id: pop_change_10y, theme: Population & demography, label_en: Population change (10 years), label_de: Bevölkerungsveränderung (10 Jahre), unit: "%", decimals: 1, direction: neutral, aggregation: "change:pop_total:10", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
