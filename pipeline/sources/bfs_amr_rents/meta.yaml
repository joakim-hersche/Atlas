caveats: "Regional value (labour market area), not a municipality rent: the Structural Survey sample is too small for most municipalities. Net rents of occupied rented dwellings (existing tenancies, not asking rents), without service and heating charges. BFS withholds values with a coefficient of variation above 10 % (none missing in 2012-2024). Time series breaks: 2015 (questionnaire change) and 2018 (method, weighting, outlier detection; BFS status B on every area in 2018). 11 values carry status U (low reliability). The confidence level of the CI measure is not stated in the data."
