# Population exposure to road and rail traffic noise (BAFU sonBASE 2021 grids, GWR buildings, STATPOP 2021 hectares). Modelled.
# Limits: immission limit values (IGW) of the Noise Abatement Ordinance (LSV): sensitivity level II 60 dB(A) day / 50 night; level III 65 / 55.
- {id: "noise_residents", label_en: "Residents in the noise calculation (hectare grid)", label_de: "Einwohner in der Lärmberechnung (Hektarraster)", description: "STATPOP 2021 hectare residents assigned to the municipality: the base of the noise shares.", source_note: "BAFU sonBASE 2021 (geo.admin.ch), GWR (BFS), STATPOP 2021 hectares (BFS)", theme: "Environment & hazards", unit: "persons", decimals: 0, direction: "neutral", aggregation: "sum", kind: "base", precision: "exact", coverage: "national", native_level: "gemeinde"}
- {id: "noise_road_day_60_residents", label_en: "Residents with road noise of 60 dB(A) or more by day", label_de: "Einwohner mit Strassenlärm von 60 dB(A) oder mehr tagsüber", description: "Residents of buildings where the modelled daytime road traffic noise (Lr, 06-22 h) is at least 60 dB(A), the immission limit value for sensitivity level II (residential zones). Modelled by ATLAS: each populated STATPOP 2021 hectare spreads its residents over the residential buildings of the GWR in proportion to their dwellings; the level is the maximum of the sonBASE 10 m grid within 10 m of the building coordinate (about the most exposed facade). A building without a mapped value counts as not exposed. The cantonal zoning is not used: this is an indicator, not the official count of people above the limit values. BAFU states that sonBASE is for statistics at national and regional level; single municipalities are indicative.", source_note: "BAFU sonBASE 2021 (geo.admin.ch), GWR (BFS), STATPOP 2021 hectares (BFS)", theme: "Environment & hazards", unit: "persons", decimals: 0, direction: "lower_better", aggregation: "sum", kind: "base", precision: "modelled", coverage: "national", native_level: "gemeinde"}
- {id: "noise_road_night_50_residents", label_en: "Residents with road noise of 50 dB(A) or more at night", label_de: "Einwohner mit Strassenlärm von 50 dB(A) oder mehr nachts", description: "Residents of buildings where the modelled night-time road traffic noise (Lr, 22-06 h) is at least 50 dB(A), the immission limit value for sensitivity level II. Modelled by ATLAS: each populated STATPOP 2021 hectare spreads its residents over the residential buildings of the GWR in proportion to their dwellings; the level is the maximum of the sonBASE 10 m grid within 10 m of the building coordinate (about the most exposed facade). A building without a mapped value counts as not exposed. The cantonal zoning is not used: this is an indicator, not the official count of people above the limit values. BAFU states that sonBASE is for statistics at national and regional level; single municipalities are indicative.", source_note: "BAFU sonBASE 2021 (geo.admin.ch), GWR (BFS), STATPOP 2021 hectares (BFS)", theme: "Environment & hazards", unit: "persons", decimals: 0, direction: "lower_better", aggregation: "sum", kind: "base", precision: "modelled", coverage: "national", native_level: "gemeinde"}
- {id: "noise_rail_day_60_residents", label_en: "Residents with rail noise of 60 dB(A) or more by day", label_de: "Einwohner mit Bahnlärm von 60 dB(A) oder mehr tagsüber", description: "Residents of buildings where the modelled daytime railway noise is at least 60 dB(A) (limit value, sensitivity level II). Railway lines cover a minority of municipalities. Modelled by ATLAS: each populated STATPOP 2021 hectare spreads its residents over the residential buildings of the GWR in proportion to their dwellings; the level is the maximum of the sonBASE 10 m grid within 10 m of the building coordinate (about the most exposed facade). A building without a mapped value counts as not exposed. The cantonal zoning is not used: this is an indicator, not the official count of people above the limit values. BAFU states that sonBASE is for statistics at national and regional level; single municipalities are indicative.", source_note: "BAFU sonBASE 2021 (geo.admin.ch), GWR (BFS), STATPOP 2021 hectares (BFS)", theme: "Environment & hazards", unit: "persons", decimals: 0, direction: "lower_better", aggregation: "sum", kind: "base", precision: "modelled", coverage: "national", native_level: "gemeinde"}
- {id: "noise_rail_night_50_residents", label_en: "Residents with rail noise of 50 dB(A) or more at night", label_de: "Einwohner mit Bahnlärm von 50 dB(A) oder mehr nachts", description: "Residents of buildings where the modelled night-time railway noise is at least 50 dB(A) (limit value, sensitivity level II). Modelled by ATLAS: each populated STATPOP 2021 hectare spreads its residents over the residential buildings of the GWR in proportion to their dwellings; the level is the maximum of the sonBASE 10 m grid within 10 m of the building coordinate (about the most exposed facade). A building without a mapped value counts as not exposed. The cantonal zoning is not used: this is an indicator, not the official count of people above the limit values. BAFU states that sonBASE is for statistics at national and regional level; single municipalities are indicative.", source_note: "BAFU sonBASE 2021 (geo.admin.ch), GWR (BFS), STATPOP 2021 hectares (BFS)", theme: "Environment & hazards", unit: "persons", decimals: 0, direction: "lower_better", aggregation: "sum", kind: "base", precision: "modelled", coverage: "national", native_level: "gemeinde"}
- {id: "noise_any_60_50_residents", label_en: "Residents with road or rail noise at or above the level-II limits", label_de: "Einwohner mit Strassen- oder Bahnlärm ab den Grenzwerten der Empfindlichkeitsstufe II", description: "Residents of buildings with road or rail noise of at least 60 dB(A) by day or at least 50 dB(A) at night. Modelled by ATLAS: each populated STATPOP 2021 hectare spreads its residents over the residential buildings of the GWR in proportion to their dwellings; the level is the maximum of the sonBASE 10 m grid within 10 m of the building coordinate (about the most exposed facade). A building without a mapped value counts as not exposed. The cantonal zoning is not used: this is an indicator, not the official count of people above the limit values. BAFU states that sonBASE is for statistics at national and regional level; single municipalities are indicative.", source_note: "BAFU sonBASE 2021 (geo.admin.ch), GWR (BFS), STATPOP 2021 hectares (BFS)", theme: "Environment & hazards", unit: "persons", decimals: 0, direction: "lower_better", aggregation: "sum", kind: "base", precision: "modelled", coverage: "national", native_level: "gemeinde"}
- {id: "noise_any_65_55_residents", label_en: "Residents with road or rail noise at or above the level-III limits", label_de: "Einwohner mit Strassen- oder Bahnlärm ab den Grenzwerten der Empfindlichkeitsstufe III", description: "Residents of buildings with road or rail noise of at least 65 dB(A) by day or at least 55 dB(A) at night (the higher immission limit values of sensitivity level III). Nationally about 745,000 people, the same order as the 740,000 people BAFU reports as harmed or annoyed at home by road traffic noise (2021). Modelled by ATLAS: each populated STATPOP 2021 hectare spreads its residents over the residential buildings of the GWR in proportion to their dwellings; the level is the maximum of the sonBASE 10 m grid within 10 m of the building coordinate (about the most exposed facade). A building without a mapped value counts as not exposed. The cantonal zoning is not used: this is an indicator, not the official count of people above the limit values. BAFU states that sonBASE is for statistics at national and regional level; single municipalities are indicative.", source_note: "BAFU sonBASE 2021 (geo.admin.ch), GWR (BFS), STATPOP 2021 hectares (BFS)", theme: "Environment & hazards", unit: "persons", decimals: 0, direction: "lower_better", aggregation: "sum", kind: "base", precision: "modelled", coverage: "national", native_level: "gemeinde"}
