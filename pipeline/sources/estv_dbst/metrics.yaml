- {id: tax_np_net_income_chf, theme: Income & tax, label_en: Net income of taxpayers (sum), label_de: Reines Einkommen der Steuerpflichtigen (Summe), unit: CHF, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, source_note: "Reines Einkommen, all taxpayers; 2008–2023 (before 2008 not published for taxpayers without federal tax). Old workbooks give 1,000 CHF (converted)."}
