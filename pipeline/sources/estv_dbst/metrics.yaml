# derived
- {id: tax_np_mean_net_income, theme: Income & tax, label_en: "Mean net income, all tax units incl. special cases (ESTV)", label_de: "Reines Einkommen pro Steuerpflichtige/n, alle Steuerpflichtigen inkl. Sonderfälle (ESTV)", unit: CHF, decimals: 0, direction: higher_better, aggregation: "ratio:tax_np_net_income_chf/tax_np_taxpayers", kind: derived, precision: exact, coverage: national, native_level: gemeinde, source_note: "Mean (not median) over tax units; 2008–2023", description: "Net income (Reineinkommen, direct federal tax) of all tax units, normal and special cases, with and without federal tax, divided by their number; a married couple counts once. ESTV's special cases (Sonderfälle; from 2020 'Übrige Sonderfälle') are, per the introduction of the ESTV municipal workbooks: lump-sum taxation (Art. 14 DBG), persons without tax residence in Switzerland who are liable for a business, permanent establishment or property here (Art. 4-5), persons whose taxable and rate-determining incomes differ because of foreign income (Art. 7), and liability for part of the year (Art. 40). Their taxable income in the municipality can be small (e.g. only a Swiss property), so where they are numerous, as in resorts with many second homes, the all-cases mean can be far below the normal-case mean. To compare the incomes of residents use the normal-case mean (2020–2023). Available 2008–2023."}
- {id: tax_np_mean_taxable_income, theme: Income & tax, label_en: "Mean taxable income, all tax units incl. special cases (ESTV)", label_de: "Steuerbares Einkommen pro Steuerpflichtige/n, alle Steuerpflichtigen inkl. Sonderfälle (ESTV)", unit: CHF, decimals: 0, direction: higher_better, aggregation: "ratio:tax_np_taxable_income_chf/tax_np_taxpayers", kind: derived, precision: exact, coverage: national, native_level: gemeinde, source_note: 2008–2023, description: "Taxable income (direct federal tax) of all tax units, normal and special cases, with and without federal tax, divided by their number; a married couple counts once. ESTV's special cases (Sonderfälle; from 2020 'Übrige Sonderfälle') are, per the introduction of the ESTV municipal workbooks: lump-sum taxation (Art. 14 DBG), persons without tax residence in Switzerland who are liable for a business, permanent establishment or property here (Art. 4-5), persons whose taxable and rate-determining incomes differ because of foreign income (Art. 7), and liability for part of the year (Art. 40). Their taxable income in the municipality can be small (e.g. only a Swiss property), so where they are numerous, as in resorts with many second homes, the all-cases mean can be far below the normal-case mean. To compare the incomes of residents use the normal-case mean, which has the same population as the median (2020–2023); this series goes back to 2008. Taxable income is after deductions and differs from gross wages."}
- {id: tax_np_share_taxable_100k_plus, theme: Income & tax, label_en: "Share of taxpayers with taxable income above CHF 100,000", label_de: Anteil Steuerpflichtige mit steuerbarem Einkommen über 100 000 Fr., unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:tax_np_normal_taxable_100k_plus/tax_np_taxpayers_normal*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde, source_note: "Normal cases (file 500), classes from CHF 100,001; 2020–2023"}
- {id: tax_np_share_no_federal_tax, theme: Income & tax, label_en: "Share of taxpayers paying no federal income tax, all tax units incl. special cases (ESTV)", label_de: "Anteil Steuerpflichtige ohne direkte Bundessteuer, alle Steuerpflichtigen inkl. Sonderfälle (ESTV)", unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:tax_np_taxpayers_no_federal_tax/tax_np_taxpayers*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde, description: "Tax units owing no direct federal tax (income below the tax threshold after deductions), as a share of all tax units, normal and special cases. ESTV's special cases (Sonderfälle; from 2020 'Übrige Sonderfälle') are, per the introduction of the ESTV municipal workbooks: lump-sum taxation (Art. 14 DBG), persons without tax residence in Switzerland who are liable for a business, permanent establishment or property here (Art. 4-5), persons whose taxable and rate-determining incomes differ because of foreign income (Art. 7), and liability for part of the year (Art. 40). Their taxable income in the municipality can be small (e.g. only a Swiss property), so where they are numerous, as in resorts with many second homes, the all-cases mean can be far below the normal-case mean. Normal-case share: tax_np_share_no_federal_tax_normal (2020–2023). Available 2003–2023."}
- {id: tax_np_federal_tax_per_capita, theme: Income & tax, label_en: Federal income tax yield per resident, label_de: Steuerertrag direkte Bundessteuer pro Einwohner/in, unit: CHF per resident, decimals: 0, direction: neutral, aggregation: "ratio:tax_np_federal_tax_chf/pop_total", kind: derived, precision: exact, coverage: national, native_level: gemeinde, source_note: "Natural persons only; population = STATPOP 31 Dec of the tax year (available from 2010)"}
- {id: tax_np_federal_tax_per_taxpayer, theme: Income & tax, label_en: "Federal income tax per taxpayer, all tax units incl. special cases (ESTV)", label_de: "Direkte Bundessteuer pro Steuerpflichtige/n, alle Steuerpflichtigen inkl. Sonderfälle (ESTV)", unit: CHF, decimals: 0, direction: neutral, aggregation: "ratio:tax_np_federal_tax_chf/tax_np_taxpayers", kind: derived, precision: exact, coverage: national, native_level: gemeinde, description: "Direct federal tax yield of natural persons (normal and special cases) divided by the number of all tax units, with and without federal tax. ESTV's special cases (Sonderfälle; from 2020 'Übrige Sonderfälle') are, per the introduction of the ESTV municipal workbooks: lump-sum taxation (Art. 14 DBG), persons without tax residence in Switzerland who are liable for a business, permanent establishment or property here (Art. 4-5), persons whose taxable and rate-determining incomes differ because of foreign income (Art. 7), and liability for part of the year (Art. 40). Their taxable income in the municipality can be small (e.g. only a Swiss property), so where they are numerous, as in resorts with many second homes, the all-cases mean can be far below the normal-case mean. Available 2003–2023."}
# normal cases (review round 3, D2/X2/X3): same population as the median and the income classes; headline income metric
- {id: tax_np_mean_taxable_income_normal, theme: Income & tax, label_en: "Mean taxable income per taxpayer (normal cases)", label_de: "Steuerbares Einkommen pro Steuerpflichtige/n (Normalfälle)", unit: CHF, decimals: 0, direction: higher_better, aggregation: "ratio:tax_np_taxable_income_normal_chf/tax_np_taxpayers_normal", kind: derived, precision: exact, coverage: national, native_level: gemeinde, source_note: "File 500 sheet 523 total / sheet 521 total; 2020–2023", description: "Taxable income (direct federal tax) of the normal cases divided by their number. Normal cases (ESTV): taxpayers liable for the whole tax year, resident in the canton and without foreign income, with and without federal tax; a married couple counts once. The same population as the median taxable income and the income classes. Taxable income is after deductions and differs from gross wages. Only 2020–2023: the older ESTV workbooks do not split taxpayers without federal tax into normal and special cases. The all-cases mean (back to 2008) also counts ESTV's special cases, which pull it down in resorts with many second homes."}
- {id: tax_np_mean_net_income_normal, theme: Income & tax, label_en: "Mean net income per taxpayer (normal cases)", label_de: "Reines Einkommen pro Steuerpflichtige/n (Normalfälle)", unit: CHF, decimals: 0, direction: higher_better, aggregation: "ratio:tax_np_net_income_normal_chf/tax_np_taxpayers_normal", kind: derived, precision: exact, coverage: national, native_level: gemeinde, source_note: "File 500 sheet 522 total / sheet 521 total; 2020–2023", description: "Net income (Reineinkommen, direct federal tax, Art. 25 DBG: income after the general deductions, before the social deductions for children and married couples that give the taxable income) of the normal cases divided by their number. Normal cases (ESTV): taxpayers liable for the whole tax year, resident in the canton and without foreign income, with and without federal tax; a married couple counts once. The same population as the median taxable income and the income classes. Only 2020–2023."}
- {id: tax_np_share_no_federal_tax_normal, theme: Income & tax, label_en: "Share of taxpayers paying no federal income tax (normal cases)", label_de: "Anteil Steuerpflichtige ohne direkte Bundessteuer (Normalfälle)", unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:tax_np_taxpayers_no_federal_tax_normal/tax_np_taxpayers_normal*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde, description: "Normal-case tax units owing no direct federal tax (income below the tax threshold after deductions), as a share of all normal-case tax units. Normal cases (ESTV): taxpayers liable for the whole tax year, resident in the canton and without foreign income, with and without federal tax; a married couple counts once. The same population as the median taxable income and the income classes. Only 2020–2023."}
- {id: tax_np_federal_tax_per_taxpayer_normal, theme: Income & tax, label_en: "Federal income tax per taxpayer (normal cases)", label_de: "Direkte Bundessteuer pro Steuerpflichtige/n (Normalfälle)", unit: CHF, decimals: 0, direction: neutral, aggregation: "ratio:tax_np_federal_tax_normal_chf/tax_np_taxpayers_normal", kind: derived, precision: exact, coverage: national, native_level: gemeinde, description: "Direct federal tax yield of the normal cases divided by the number of normal-case tax units, with and without federal tax. Normal cases (ESTV): taxpayers liable for the whole tax year, resident in the canton and without foreign income, with and without federal tax; a married couple counts once. The same population as the median taxable income and the income classes. Only 2020–2023."}
