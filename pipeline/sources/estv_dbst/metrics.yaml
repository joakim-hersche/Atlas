# ESTV Statistik der direkten Bundessteuer, natürliche Personen, by municipality. Period = tax year.
# Unit = taxpayer (tax unit: a married couple counts once). All taxpayers = with and without federal tax,
# normal and special cases. Amounts in CHF.
- {id: tax_np_taxpayers, theme: Income & tax, label_en: Taxpayers (federal income tax), label_de: Steuerpflichtige (direkte Bundessteuer), unit: taxpayers, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, source_note: "All taxpayers with and without federal tax, normal and special cases. 2003–2023 (2001–2002 incomplete: some cantons still on two-year assessment)."}
