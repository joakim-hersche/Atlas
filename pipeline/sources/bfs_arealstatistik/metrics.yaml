- {id: area_share_wooded, label_en: "Wooded area (share)", label_de: "Anteil bestockte Fläche (Wald)", unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:area_wooded_ha/area_total_ha*100", theme: Land use & built environment, kind: derived, precision: survey, coverage: national, native_level: gemeinde, source_note: "2020/25 only for AG, BL, BS, FR, GE, JU, LU, NE, SO, VD so far (survey in progress)"}
