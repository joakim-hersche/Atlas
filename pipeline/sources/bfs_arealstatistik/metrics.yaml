# Arealstatistik per survey period ('1979/85' ... '2020/25'). base = delivered; derived = computed by the build.
# precision survey: sample survey on hectare sample points. include_pseudo: lake areas outside municipalities
# (9xxx) and Kommunanzen are added to canton and Swiss sums, as in the published canton totals.
- {id: area_total_ha, label_en: "Total area (land use statistics)", label_de: "Gesamtfläche (Arealstatistik)", theme: Land use & built environment, unit: ha, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: survey, coverage: national, native_level: gemeinde, source_note: "2020/25 only for AG, BL, BS, FR, GE, JU, LU, NE, SO, VD so far (survey in progress)", include_pseudo: true}
