# BFS accessibility of services (hectare grid 2011, 2015, 2018, 2021): road-network distance from
# each inhabited hectare to the nearest service, aggregated to municipalities weighted by residents.
- {id: acc_population, theme: Mobility & accessibility, label_en: Residents in the accessibility grid, label_de: Einwohner im Erreichbarkeitsraster, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Permanent residents of the inhabited hectares of the BFS accessibility grid assigned to the municipality; weight of the mean distances and denominator of the shares.", source_note: "Hectare counts of 1–3 residents are published as 3 (data protection), so the total is slightly above STATPOP."}
- {id: acc_dist_supermarket, theme: Mobility & accessibility, label_en: "Distance to the nearest supermarket", label_de: "Distanz zum nächsten Supermarkt", unit: m, decimals: 0, direction: lower_better, aggregation: "weighted_mean:acc_population", kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Population-weighted mean road distance from residents' hectares to the nearest supermarkets 400–2499 m² (NOGA 471102, 471103).", source_note: "Shortest distance on the road network (swissTLM3D, no paths), from the hectare centre; hectares more than 500 m from the network have no value and are left out of the mean. Location only; quality and opening hours not considered."}
