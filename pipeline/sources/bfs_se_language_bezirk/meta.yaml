title: Structural Survey – main languages by district, 3-year pooled, with confidence intervals
publisher: BFS (Federal Statistical Office) – Strukturerhebung (SE)
url: https://dam-api.bfs.admin.ch/hub/api/dam/assets/36491978/master
license: "OPEN-BY – open use, the source must be provided (BFS termsOfUse)"
attribution: "Source: BFS – Strukturerhebung (SE), kumuliert"
vintage: districts as valid on 31 Dec of the last pooled year; matched by canton + district name to the register (data/interim/backbone/district_version.parquet). Early editions use pre-reform GR districts (1821–1831, up to 2015) and NE districts (2401–2406, up to 2017), which no longer exist at the reference state.
years: pooled 2011-2013 … 2022-2024 (12 annual rolling editions; period = 'YYYY-YYYY')
precision: survey (95 % CI per value)
notes: "Level bezirk + schweiz only (D21: regional value, not municipal). Multiple main languages per person since 2010 – not comparable with the census single answer (bfs_census_1970_2000). Cantons without districts appear in the SE table with their district entry; the register's 'bezirksfreies Gebiet' entries have no SE row. First three editions are legacy .xls files (cached under .xlsx names; parsed by magic bytes)."
