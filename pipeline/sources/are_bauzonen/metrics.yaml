- {id: bz_share_unbuilt_low, theme: Land use & built environment, label_en: Unbuilt share of building zones (lower estimate), label_de: Anteil unüberbaute Bauzonen (Annahme 1), unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:bz_unbuilt_low_ha/bz_area_total_ha*100", kind: derived, precision: modelled, coverage: national, native_level: gemeinde}
- {id: bz_share_unbuilt_high, theme: Land use & built environment, label_en: Unbuilt share of building zones (upper estimate), label_de: Anteil unüberbaute Bauzonen (Annahme 2), unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:bz_unbuilt_high_ha/bz_area_total_ha*100", kind: derived, precision: modelled, coverage: national, native_level: gemeinde}
