# derived
- {id: bz_area_per_inhabitant, theme: Land use & built environment, label_en: Building-zone area per inhabitant, label_de: Bauzonenfläche pro Einwohner/in, unit: "m² per inhabitant", decimals: 0, direction: neutral, aggregation: "ratio:bz_area_total_ha/pop_total*10000", kind: derived, precision: exact, coverage: national, native_level: gemeinde, source_note: "All permanent residents of the municipality (STATPOP, 31 Dec of the edition year); ARE's own figure uses residents inside building zones only"}
