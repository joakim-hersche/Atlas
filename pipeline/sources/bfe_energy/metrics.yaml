# Energie Reporter (monthly slices, period YYYY-MM), BFE solar potential (2025), Energiestädte (2026).
- {id: en_ecar_count, theme: Energy & climate, label_en: Electric cars, label_de: Elektroautos, unit: cars, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Battery-electric passenger cars registered in the municipality (Energie Reporter, from the federal vehicle register)."}
- {id: en_ecar_share, theme: Energy & climate, label_en: Electric car share, label_de: Anteil Elektroautos, unit: "% of passenger cars", decimals: 1, direction: higher_better, aggregation: not_aggregatable, kind: base, precision: modelled, coverage: national, native_level: gemeinde, source_note: "Published canton rows are kept only for months in which the canton's territory equals the reference territory (Moutier BE->JU on 2026-01-01, Clavaleyres BE->FR on 2022-01-01; decision D16).", description: "Battery-electric cars as a share of all passenger cars (Energie Reporter, monthly; the latest month is shown). The car total is not published, so the share cannot be re-aggregated; canton and Swiss values are the reporter's own (native rows). For the annual BFS vehicle-stock figure, aggregated at every level, see Mobility: 'Battery-electric share of cars'."}
- {id: en_charging_spots, theme: Energy & climate, label_en: Public charging points, label_de: Öffentliche Ladepunkte, unit: charging points, decimals: 0, direction: higher_better, aggregation: sum, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Public charging points for electric cars (Energie Reporter, from 2023-11).", source_note: "Slice 2023-11 covers only about half of the municipalities (others no_data); canton rows of that month are the reporter's own."}
- {id: en_pv_installed_kwp, theme: Energy & climate, label_en: Installed solar PV capacity, label_de: Installierte Photovoltaik-Leistung, unit: kWp, decimals: 0, direction: higher_better, aggregation: sum, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Peak capacity of grid-connected photovoltaic installations (Energie Reporter)."}
- {id: en_pv_kwp_per_capita, theme: Energy & climate, label_en: Solar PV capacity per resident, label_de: Photovoltaik-Leistung pro Kopf, unit: kWp per resident, decimals: 2, direction: higher_better, aggregation: "weighted_mean:pop_total", kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Installed PV capacity divided by the STATPOP permanent resident population (31 Dec of the previous year; same year for December slices; 2025 at most). Computed by ATLAS."}
- {id: en_solar_potential_used, theme: Energy & climate, label_en: Solar potential used, label_de: Genutztes Solarpotenzial, unit: "%", decimals: 1, direction: higher_better, aggregation: "weighted_mean:en_solar_roof_potential_gwh", kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Expected annual production of installed PV as a share of the suitable roof and facade potential (Energie Reporter, sonnendach.ch / sonnenfassade.ch). Higher levels: weighted by the BFE roof potential (approximation)."}
- {id: en_heat_renewable_count, theme: Energy & climate, label_en: Buildings heated with renewables, label_de: Gebäude mit erneuerbarer Heizung, unit: buildings, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Buildings with a renewable main heat source (heat pump, wood, district heat, solar thermal), Energie Reporter from the GWR."}
- {id: en_heat_nonrenewable_count, theme: Energy & climate, label_en: Buildings heated with fossil fuels or electric resistance, label_de: Gebäude mit nicht erneuerbarer Heizung, unit: buildings, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Buildings with a non-renewable main heat source (Energie Reporter, from the GWR). Buildings without heating are excluded."}
- {id: en_elec_consumption_mwh, theme: Energy & climate, label_en: Electricity consumption, label_de: Stromverbrauch, unit: MWh per year, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Electricity consumption over a rolling 12-month window (window in the note), Energie Reporter from distribution system operators (from 2023-05)."}
- {id: en_elec_consumption_per_capita, theme: Energy & climate, label_en: Electricity consumption per resident, label_de: Stromverbrauch pro Kopf, unit: MWh per resident and year, decimals: 2, direction: neutral, aggregation: "weighted_mean:pop_total", kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Electricity consumption (all sectors) divided by the STATPOP population (see en_pv_kwp_per_capita). Computed by ATLAS; the reporter's own per-capita value uses its own population and differs slightly."}
- {id: en_renelec_production_mwh, theme: Energy & climate, label_en: Renewable electricity production, label_de: Erneuerbare Stromproduktion, unit: MWh per year, decimals: 0, direction: higher_better, aggregation: sum, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Renewable electricity produced in the municipality over a rolling 12-month window (hydro, solar, wind, biomass, waste), Energie Reporter (from 2023-10).", source_note: "In the first slices (2023-10..2023-12) the reporter's canton totals for AG and SO exceed the sum of their municipalities by up to 2% (solar); later slices match exactly."}
- {id: en_renelec_hydro_mwh, theme: Energy & climate, label_en: Hydro electricity production, label_de: Stromproduktion Wasserkraft, unit: MWh per year, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Hydropower production, rolling 12 months (Energie Reporter). Attributed to the plant location."}
- {id: en_renelec_solar_mwh, theme: Energy & climate, label_en: Solar electricity production, label_de: Solarstromproduktion, unit: MWh per year, decimals: 0, direction: higher_better, aggregation: sum, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Solar PV production, rolling 12 months (Energie Reporter)."}
- {id: en_renelec_per_capita, theme: Energy & climate, label_en: Renewable electricity production per resident, label_de: Erneuerbare Stromproduktion pro Kopf, unit: MWh per resident and year, decimals: 2, direction: higher_better, aggregation: "weighted_mean:pop_total", kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Renewable electricity production divided by the STATPOP population (see en_pv_kwp_per_capita). Dominated by hydropower in Alpine municipalities."}
- {id: en_solar_roof_potential_gwh, theme: Energy & climate, label_en: Rooftop solar potential, label_de: Solarstrompotenzial Dächer, unit: GWh per year, decimals: 1, direction: neutral, aggregation: sum, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Potential solar electricity from all suitable roofs (BFE, sonnendach.ch, scenario 1: roofs only, electricity only). Roofs below 10 m² excluded."}
- {id: en_solar_roof_facade_potential_gwh, theme: Energy & climate, label_en: Solar potential roofs and facades, label_de: Solarstrompotenzial Dächer und Fassaden, unit: GWh per year, decimals: 1, direction: neutral, aggregation: sum, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Potential solar electricity from suitable roofs and facades (BFE, scenario 3)."}
- {id: energiestadt_label, theme: Energy & climate, label_en: Energiestadt label, label_de: Label Energiestadt, unit: "1 = labelled, 0 = not", decimals: 0, direction: neutral, aggregation: not_aggregatable, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Municipality holds the Energiestadt (Energy City) label (BFE list of label holders, November 2026).", source_note: "The regional label 'Sensebezirk' (FR) is not attributed to municipalities."}
