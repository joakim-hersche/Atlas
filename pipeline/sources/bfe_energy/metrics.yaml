- {id: energiestadt_score, theme: Energy & climate, label_en: Energiestadt score, label_de: Energiestadt-Punktzahl, unit: "% of possible points", decimals: 0, direction: higher_better, aggregation: not_aggregatable, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Points achieved in the latest Energiestadt audit; not applicable without a label."}
