# Federal popular votes by municipality, 1960–today (BFS PxWeb px-x-1703030000_101).
# PERIOD CONVENTION: one period per Vorlage, 'YYYY-MM-DD#<vorlagenId>' (vote date + BFS vorlagenId,
# the same key voteinfo uses). Titles (de/fr/it/rm/en) and the accepted flag are in vorlagen.csv.
# Pseudo-units (D17: Swiss abroad 90x0, postal voting 90x1, 'Anderes' 90x2) are level 'pseudo' rows,
# unit_id = BFS code (digits 2–3 = canton number); they belong in canton and national totals only.
- {id: vote_eligible, theme: Politics, label_en: Eligible voters (federal vote), label_de: Stimmberechtigte (eidg. Abstimmung), unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Persons entitled to vote on the Vorlage. Period = 'YYYY-MM-DD#vorlagenId'.", source_note: "BFS re-aggregates all votes to the current municipality state. Pseudo-units have no eligible voters before ~1990 (empty).", zero_when: [not_published], include_pseudo: true}
- {id: vote_ballots, theme: Politics, label_en: Ballots cast (federal vote), label_de: Abgegebene Stimmen (eidg. Abstimmung), unit: ballots, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Ballots cast (incl. blank and invalid). Period = 'YYYY-MM-DD#vorlagenId'.", zero_when: [not_published], include_pseudo: true}
- {id: vote_valid, theme: Politics, label_en: Valid ballots (federal vote), label_de: Gültige Stimmzettel (eidg. Abstimmung), unit: ballots, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Valid ballots. Equals yes + no for single Vorlagen; for initiative / counter-proposal / Stichfrage packages it counts ballots, so it exceeds yes + no of each question. Period = 'YYYY-MM-DD#vorlagenId'.", zero_when: [not_published], include_pseudo: true}
- {id: vote_yes, theme: Politics, label_en: Yes votes, label_de: Ja-Stimmen, unit: votes, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Yes votes. For a Stichfrage (tie-break question) 'yes' means the initiative, 'no' the counter-proposal. Period = 'YYYY-MM-DD#vorlagenId'.", zero_when: [not_published], include_pseudo: true}
- {id: vote_no, theme: Politics, label_en: No votes, label_de: Nein-Stimmen, unit: votes, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "No votes. Period = 'YYYY-MM-DD#vorlagenId'.", zero_when: [not_published], include_pseudo: true}
# derived
- {id: vote_yes_share, theme: Politics, label_en: Yes share, label_de: Ja-Anteil, unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:vote_yes/vote_yes+vote_no*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde, description: "Yes votes as a share of yes + no votes, per Vorlage – the BFS definition of 'Ja in %' (verified against the cube). Not yes/valid ballots: with initiative + counter-proposal + Stichfrage (double yes), valid ballots per Vorlage exceed yes + no."}
- {id: vote_turnout, theme: Politics, label_en: Turnout (federal vote), label_de: Stimmbeteiligung, unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:vote_ballots/vote_eligible*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde, description: "Ballots cast as a share of eligible voters, per Vorlage (BFS 'Beteiligung in %')."}
