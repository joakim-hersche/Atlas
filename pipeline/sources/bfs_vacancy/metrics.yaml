- {id: vac_rate, theme: Housing & buildings, label_en: Vacancy rate, label_de: Leerwohnungsziffer, unit: "%", decimals: 2, direction: neutral, aggregation: "ratio:vac_dwellings/vac_dwelling_stock*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde, source_note: "vacant dwellings on 1 June / GWS dwellings 31 Dec previous year; equals the BFS rate; 2011+"}
- {id: vac_rate_rent, theme: Housing & buildings, label_en: Vacant rental dwellings (share of stock), label_de: Leer stehende Mietwohnungen (Anteil am Bestand), unit: "%", decimals: 2, direction: neutral, aggregation: "ratio:vac_for_rent/vac_dwelling_stock*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde, source_note: "denominator is the total stock (owner-occupied included)"}
