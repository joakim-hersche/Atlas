# Residents in natural-hazard zones from the cantonal hazard maps (geodienste.ch, MGDM 166.1), `*` metric.
# Zonal statistics with STATPOP 2025 hectare residents (hectare centre in polygon). Period 2026 = map state at download.
- {id: haz_residents_high, theme: Environment & hazards, label_en: Residents in high-hazard (red) zones*, label_de: Einwohner in Zonen erheblicher Gefährdung (rot)*, unit: persons, decimals: 0, direction: lower_better, aggregation: sum, kind: base, precision: modelled, coverage: "partial:AG,AI,AR,BE,BL,FR,GE,GL,GR,JU,LU,NE,SG,SH,SO,SZ,TG,TI,VS,ZG,ZH", native_level: gemeinde, description: "STATPOP 2025 residents living in hectares whose centre lies in a zone of high hazard (erheblich, red) on the cantonal hazard map (process-wise hazard areas and synoptic map, highest level of all processes: flood, landslide, rockfall, avalanche as mapped).", source_note: "Processes differ by canton (AG flood only; TG flood and landslide; avalanche only where relevant), see row note. Hazard maps cover only the surveyed perimeters (mostly settlement areas); residents outside them are not assessed (see haz_residents_assessed), not hazard-free. Hectare resolution: a hectare counts entirely when its centre is in the zone. Map update dates differ by canton (2022–2026, row note). NW, OW, UR, VD (download needs approval) and BS (not published) are not covered."}
- {id: haz_residents_medium, theme: Environment & hazards, label_en: Residents in medium-hazard (blue) zones*, label_de: Einwohner in Zonen mittlerer Gefährdung (blau)*, unit: persons, decimals: 0, direction: lower_better, aggregation: sum, kind: base, precision: modelled, coverage: "partial:AG,AI,AR,BE,BL,FR,GE,GL,GR,JU,LU,NE,SG,SH,SO,SZ,TG,TI,VS,ZG,ZH", native_level: gemeinde, description: "STATPOP 2025 residents in hectares whose centre lies in a zone where the highest hazard level is medium (mittel, blue), all processes combined. Red zones are not included."}
- {id: haz_residents_assessed, theme: Environment & hazards, label_en: Residents inside the assessed hazard-map perimeter*, label_de: Einwohner im beurteilten Gefahrenkarten-Perimeter*, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: modelled, coverage: "partial:AG,AI,AR,BE,BL,FR,GE,GL,GR,JU,LU,NE,SG,SH,SO,SZ,TG,TI,VS,ZG,ZH", native_level: gemeinde, description: "STATPOP 2025 residents in hectares whose centre lies in any polygon of the synoptic hazard map (any level, including 'not endangered' and residual hazard) or of the survey perimeter layer (erhebungsgebiet) where the canton delivers one.", source_note: "Assessed area = survey perimeter (erhebungsgebiet, delivered by 17 cantons) plus every mapped hazard polygon of any level. Where a canton delivers neither a perimeter nor 'not endangered' areas (FR), the value is no_data. AI, VS deliver no perimeter: their assessed area is the mapped area including 'not endangered' polygons. A share near 100% means the settled area is covered by the map, not that every hectare was surveyed for every process. AG delivers flood hazard only, TG flood and landslide, several cantons no avalanche (row note lists the processes)."}
- {id: haz_hectare_residents, theme: Environment & hazards, label_en: "Residents (hectare grid, hazard denominator)*", label_de: "Einwohner (Hektarraster, Nenner Gefahren)*", unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: "partial:AG,AI,AR,BE,BL,FR,GE,GL,GR,JU,LU,NE,SG,SH,SO,SZ,TG,TI,VS,ZG,ZH", native_level: gemeinde, description: "STATPOP 2025 hectare residents assigned to the municipality on the reference-state boundaries (denominator of the hazard shares)."}
