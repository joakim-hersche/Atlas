- {id: haz_share_high_medium, theme: Environment & hazards, label_en: Share of residents in red or blue hazard zones*, label_de: Anteil Einwohner in roten oder blauen Gefahrenzonen*, unit: "%", decimals: 1, direction: lower_better, aggregation: "ratio:haz_residents_high+haz_residents_medium/haz_hectare_residents*100", kind: derived, precision: modelled, coverage: "partial:AG,AI,AR,BE,BL,FR,GE,GL,GR,JU,LU,NE,SG,SH,SO,SZ,TG,TI,VS,ZG,ZH", native_level: gemeinde}
