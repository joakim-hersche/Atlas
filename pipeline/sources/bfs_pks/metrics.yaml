- {id: pks_vehicle_theft_per_1000, theme: Safety, label_en: "Vehicle theft without bicycles (Art. 139) per 1,000 residents (district)", label_de: "Fahrzeugdiebstahl ohne Fahrraddiebstahl (Art. 139 StGB) pro 1000 Einwohner (Bezirk)", unit: per 1000 residents, decimals: 2, direction: lower_better, aggregation: "ratio:pks_vehicle_theft/pks_pop*1000", kind: derived, precision: exact, coverage: national, native_level: bezirk, description: "Theft of vehicles other than bicycles (StGB Art. 139). Since 2013 'Entwendung zum Gebrauch' (joyriding, Art. 94 SVG) is no longer counted as vehicle theft (BFS). BFS Häufigkeitszahl (HZ): offences registered by the police per 1,000 residents, HZ = registered offences × 1000 / permanent resident population at the end of the previous year (STATPOP; ESPOP until 2010). Offences are counted where they were committed: districts with city centres, nightlife, shopping centres or large stations have high rates because many non-residents are present. BFS: the PKS is better suited to trends over time than to geographic comparisons."}
