# BFS PKS (police crime statistics): offences by district (all Switzerland), canton and Switzerland, 2009-latest.
# Counts are base metrics (sum); rates per 1,000 residents (BFS Häufigkeitszahl) are derived count / pks_pop * 1000.
# Native level bezirk: shown on the municipality map as each municipality's district value (regional value, D21).
- {id: pks_stgb, theme: Safety, label_en: "Criminal Code offences (district)", label_de: "Straftaten gemäss Strafgesetzbuch (Bezirk)", unit: offences, decimals: 0, direction: lower_better, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: bezirk, description: "All offences against the Swiss Criminal Code (StGB). Number of offences registered by the police in the PKS year, counted where they were committed.", source_note: "BFS – Polizeiliche Kriminalstatistik (PKS) via the Swiss Stats Map Explorer (dataset ch_19_03, data as of 23.03.2026; undocumented JSON of the map, cached). Districts on the state of 1 Jan 2023 for all years (back-cast by BFS); district 2604 Moutier (created 2026) has no value, 241 Jura bernois includes Moutier. Offences the police could not assign to a district are only in the canton value (district sums are lower, e.g. Aargau 2009, Genève every year). Switzerland = sum of the 26 canton values (Criminal Code total: published national total incl. offences without a canton). District level only below the canton (D21: shown on municipalities as the district's value)."}
