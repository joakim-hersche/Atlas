- {id: pks_stgb_per_1000, theme: Safety, label_en: "Criminal Code offences per 1,000 residents (district)", label_de: "Straftaten gemäss Strafgesetzbuch pro 1000 Einwohner (Bezirk)", unit: per 1000 residents, decimals: 1, direction: lower_better, aggregation: "ratio:pks_stgb/pks_pop*1000", kind: derived, precision: exact, coverage: national, native_level: bezirk, description: "All offences against the Swiss Criminal Code (StGB). BFS Häufigkeitszahl (HZ): offences registered by the police per 1,000 residents, HZ = registered offences × 1000 / permanent resident population at the end of the previous year (STATPOP; ESPOP until 2010). Offences are counted where they were committed: districts with city centres, nightlife, shopping centres or large stations have high rates because many non-residents are present. BFS: the PKS is better suited to trends over time than to geographic comparisons."}
