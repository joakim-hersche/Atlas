- {id: pks_theft_per_1000, theme: Safety, label_en: "Theft without shoplifting (Art. 139) per 1,000 residents (district)", label_de: "Diebstahl ohne Ladendiebstahl (Art. 139 StGB) pro 1000 Einwohner (Bezirk)", unit: per 1000 residents, decimals: 1, direction: lower_better, aggregation: "ratio:pks_theft/pks_pop*1000", kind: derived, precision: exact, coverage: national, native_level: bezirk, description: "All forms of theft (StGB Art. 139: unspecified, burglary, sneak-in theft, snatching, pickpocketing, trick theft, vehicle theft, theft from and breaking into vehicles, theft by household members) except shoplifting, which some cantons handle in simplified procedures directly through the justice system (BFS). BFS Häufigkeitszahl (HZ): offences registered by the police per 1,000 residents, HZ = registered offences × 1000 / permanent resident population at the end of the previous year (STATPOP; ESPOP until 2010). Offences are counted where they were committed: districts with city centres, nightlife, shopping centres or large stations have high rates because many non-residents are present. BFS: the PKS is better suited to trends over time than to geographic comparisons."}
