- {id: pks_betmg_per_1000, theme: Safety, label_en: "Narcotics Act offences (BetmG) per 1,000 residents (district)", label_de: "Straftaten gemäss Betäubungsmittelgesetz (BetmG) pro 1000 Einwohner (Bezirk)", unit: per 1000 residents, decimals: 1, direction: lower_better, aggregation: "ratio:pks_betmg/pks_pop*1000", kind: derived, precision: exact, coverage: national, native_level: bezirk, description: "Offences against the Federal Narcotics Act (BetmG). Largely 'control crime': the numbers depend on how much the police checks. BFS Häufigkeitszahl (HZ): offences registered by the police per 1,000 residents, HZ = registered offences × 1000 / permanent resident population at the end of the previous year (STATPOP; ESPOP until 2010). Offences are counted where they were committed: districts with city centres, nightlife, shopping centres or large stations have high rates because many non-residents are present. BFS: the PKS is better suited to trends over time than to geographic comparisons."}
- {id: pks_aig_per_1000, theme: Safety, label_en: "Foreign Nationals and Integration Act offences (AIG) per 1,000 residents (district)", label_de: "Straftaten gemäss Ausländer- und Integrationsgesetz (AIG) pro 1000 Einwohner (Bezirk)", unit: per 1000 residents, decimals: 1, direction: lower_better, aggregation: "ratio:pks_aig/pks_pop*1000", kind: derived, precision: exact, coverage: national, native_level: bezirk, description: "Offences against the Foreign Nationals and Integration Act (AIG; e.g. illegal entry or stay, working without a permit). Largely 'control crime': depends on police checks, e.g. at borders and transport hubs. BFS Häufigkeitszahl (HZ): offences registered by the police per 1,000 residents, HZ = registered offences × 1000 / permanent resident population at the end of the previous year (STATPOP; ESPOP until 2010). Offences are counted where they were committed: districts with city centres, nightlife, shopping centres or large stations have high rates because many non-residents are present. BFS: the PKS is better suited to trends over time than to geographic comparisons."}
- {id: pks_kt_clearance_rate, theme: Safety, label_en: "Clearance rate of Criminal Code offences (canton)", label_de: "Aufklärungsquote der Straftaten gemäss StGB (Kanton)", unit: "%", decimals: 1, direction: higher_better, aggregation: "ratio:pks_kt_stgb_cleared/pks_stgb*100", kind: derived, precision: exact, coverage: national, native_level: kanton, description: "Share of the StGB offences registered in the PKS year that the police records as cleared (STAT-TAB px-x-1903020100_101). The clearance rate differs strongly between offence types (Switzerland 2025, same cube: shoplifting 86 %, simple bodily injury 86 %, burglary 20 %, all StGB offences 39 %), so it partly reflects the canton's offence mix."}
