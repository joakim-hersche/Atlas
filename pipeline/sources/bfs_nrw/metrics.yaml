- {id: nrw_leaning, label_en: 'Political leaning: right share of left + right (National Council)', label_de: 'Politische Ausrichtung: rechter Anteil an links + rechts (Nationalrat)', unit: '%', decimals: 1, aggregation: 'ratio:nrw_fw_svp+nrw_fw_fdp+nrw_fw_lps+nrw_fw_edu+nrw_fw_lega+nrw_fw_mcr+nrw_fw_sd+nrw_fw_fps+nrw_fw_rep/nrw_fw_sp+nrw_fw_gruene+nrw_fw_pda+nrw_fw_sol+nrw_fw_fga+nrw_fw_poch+nrw_fw_psa+nrw_fw_svp+nrw_fw_fdp+nrw_fw_lps+nrw_fw_edu+nrw_fw_lega+nrw_fw_mcr+nrw_fw_sd+nrw_fw_fps+nrw_fw_rep*100', kind: derived, theme: Politics, direction: neutral, precision: exact, coverage: national, native_level: gemeinde, description: 'Right bloc as a share of the left and right blocs together: right / (left + right) × 100. Above 50 % = right-leaning, below 50 % = left-leaning; the centre bloc is left out of the ratio and shown alongside. Blocs as in the left and right bloc metrics (BFS DAM 446123, 446795). Single-seat cantons (UR, OW, NW, GL, AI; AR from 2003; BFS cube px-x-1702020000_103) elect by majority: votes go to candidates, not party lists, so their shares are kept in the card but left out of maps, ranks and statistics by default; regions and typologies use the proportional cantons only. National values include them, as BFS does.', keywords: leaning · Ausrichtung · orientation · left right · links rechts · gauche droite, majority_election: true}
