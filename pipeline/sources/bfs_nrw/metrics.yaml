# municipal and canton values keep LPS separate: Σ municipal nrw_fw_fdp = CH FDP − Σ nrw_fw_lps (checked exactly).
# Pseudo-units (D17, 9xxx: Swiss abroad, postal voting, other) are level 'pseudo' rows; canton/national only.
