- {id: taxb_city_single_50k, theme: Income & tax, label_en: "Tax burden: single, no children, CHF 50,000 (cities)", label_de: "Steuerbelastung: ledig, ohne Kinder, CHF 50'000 (Städte)", unit: "% of gross income", decimals: 2, direction: lower_better, aggregation: not_aggregatable, kind: base, precision: modelled, coverage: "partial: 179 cities of the Swiss cities statistics (SSV)", native_level: gemeinde, description: "Total income tax burden (federal, cantonal, municipal and church tax) of a single, no children household with gross earned income of CHF 50,000, in % of that income. Source flow: 'Ledige, ein Einkommen, ohne Kinder'.", source_note: "BFS/SSV Statistik der Schweizer Städte (data: ESTV Steuerstatistiken), flow DF_SSV_TAX_BRDN_REV_SIN, editions 2025.2 (tax year 2023) and 2026.1.0 (2024); 179 cities only. The flows do not state which taxes are included; checked against the ESTV calculator (2024, married 2 children CHF 100k) the values equal the total incl. federal, cantonal, municipal, church and personal tax within 0.006 pp in about half the cities and differ by up to 0.5 pp by canton elsewhere (church-tax assumption likely differs)."}
