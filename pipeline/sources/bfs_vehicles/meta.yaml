source_id: bfs_vehicles
title: Road vehicles – passenger-car stock and new registrations by municipality (MFZ / IVS, SDMX)
publisher: BFS (Federal Statistical Office), data from ASTRA/FEDRO vehicle registers (IVZ)
url: https://disseminate.stats.swiss/rest/data/CH1.MFZ_IVS,DF_MFZ_0_COMMUNE,1.0.0/._T.001..A
license: "OPEN-BY – open use, the source must be provided (BFS termsOfUse, assets https://www.bfs.admin.ch/asset/en/DF_MFZ_0_COMMUNE, .../DF_IVS_0_COMMUNE)"
attribution: "Source: BFS – Strassenfahrzeugbestand (MFZ) / Neue Inverkehrsetzungen (IVS)"
vintage: geo codes on the municipality state of 2025-04-05 (codelist CL_DIFF_KT_BEZ_GDE_SNAP_2025, all years re-mapped by BFS); mapped to the reference state (mergers only)
years: stock 2010–2025 (30 September); new registrations 2010–2025 (calendar year)
dataflows: [CH1.MFZ_IVS DF_MFZ_0_COMMUNE 1.0.0, CH1.MFZ_IVS DF_IVS_0_COMMUNE 1.0.0]
client: pipeline/sources/bfs_sdmx
catalog_ids: [bfs_vehicles_gemeinde]
notes: >-
  BFS notes: municipality allocation via postcode + locality, methodological changes in 2018 (IVZ
  register, canton from number plate) and 2025 – limited comparability across those years; from
  2018 (canton) / 2020 (municipality) large rental companies register their fleets in Appenzell AI,
  so use private-holder cars there. Vehicles not attributable to a municipality (codes G_<canton>,
  _U) are only in canton/national totals (about 18 000 cars in 2025). Zero cells are omitted by the
  flow and are filled with 0 for municipalities in the flow (fuel rows sum to the total).
  New registrations use registration type N (new vehicles); '_T' (incl. used imports) exists per
  municipality only for 2025 and is not delivered.
