vintage: "Per canton and year, inferred from that canton's BFS numbers (VD back-cast on the current state; ZH per year: merged municipalities take ZH's back-cast value where published, otherwise their predecessors valid on 31 Dec of the year (summed for counts, ratios only if 1:1)); reprojected to the reference state; ratios kept only where the mapping is 1:1"
