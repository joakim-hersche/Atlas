# Municipal finance key ratios compiled from cantonal sources (`*` metric, decisions D2/D4/D21).
# Period = accounting year. Municipalities of cantons without a source: status not_covered.
- {id: fin_net_debt_per_capita, theme: Public finances, label_en: Net debt per resident*, label_de: Nettoschuld I pro Einwohner*, unit: CHF per resident, decimals: 0, direction: lower_better, aggregation: not_aggregatable, kind: base, precision: exact, coverage: "partial:ZH,LU,BL,FR,SO,AG,GR,TG,GE", native_level: gemeinde, description: "HRM2 net debt I = borrowed capital (Fremdkapital) minus financial assets (Finanzvermögen), per resident at 31 December. Positive = net debt, negative = net assets. Compiled by Gemeindebank from cantonal publishers.", source_note: "ZH publishes net assets (Nettovermögen), sign flipped here. LU and BL computed by Gemeindebank from the full HRM2 accounts (20 − 10, STATPOP residents of the year). HRM1/HRM2 break: ZH values before 2019 and GE values before 2018 are HRM1/MCH1 (row note); GE revalued financial assets at market value with MCH2. Scope: in ZH and TG the political municipality excludes the separate school municipalities (Schulgemeinden), so school debt is missing compared with unified municipalities elsewhere; special-purpose associations (Zweckverbände) distort comparisons everywhere (SO warns explicitly). Years: ZH 1990–2024, LU 2019–2025, BL 2014–2025, FR 2022–2024, SO 2021–2025, AG 2025, GR 2019–2024, TG 2019–2024, GE 2000–2024. VD publishes no per-resident net debt."}
- {id: fin_self_financing_ratio, theme: Public finances, label_en: Self-financing ratio*, label_de: Selbstfinanzierungsgrad*, unit: "%", decimals: 0, direction: higher_better, aggregation: not_aggregatable, kind: base, precision: exact, coverage: "partial:ZH,LU,BL,FR,SO,AG,GR,TG,VD", native_level: gemeinde, description: "Self-financing (Selbstfinanzierung) as a percentage of net investments, single accounting year. Above 100% = investments fully financed from own funds. Compiled by Gemeindebank from cantonal publishers.", source_note: "Annual values in every canton (not the 5-year means some cantons show on maps). LU and BL computed by Gemeindebank from the HRM2 accounts: self-financing = revenue − expenditure (without closing accounts) + 33 + 35 − 45 + 364 + 365 + 366 + 383 + 387 + 389 − 4490 − 466 − 487 − 489; net investments = 5 (without 59) − 6 (without 69); not computable when net investments ≤ 0 (status not_applicable). AG marks non-computable values ('...'); VD reports 100% for communes without investments, kept as not_applicable. VD communes mix MCH1 and MCH2. ZH values before 2019 are HRM1. Values swing strongly from year to year in small municipalities. ZH and TG: political municipality without school municipalities. Years: ZH 1990–2024, LU 2019–2025, BL 2014–2025, FR 2022–2024, SO 2021–2025, AG 2025, GR 2019–2024, TG 2019–2024, VD 2017–2025. GE publishes no self-financing ratio per commune."}
- {id: fin_tax_revenue_chf, theme: Public finances, label_en: Municipal tax revenue*, label_de: Steuerertrag der Gemeinde*, unit: CHF, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: "partial:ZH,LU,BL", native_level: gemeinde, description: "Tax revenue of the municipality (HRM2 Kontenart 40 Fiskalertrag) in CHF.", source_note: "LU and BL: Kontenart 40 from the full accounts (2019–2025, 2014–2025). ZH: Gemeindeporträt indicator 297 'Steuerertrag Politische/Schulgemeinde' (1995–2024, published in Mio. CHF with 0.1 precision); it includes the school municipalities' taxes and excludes church taxes. Other cantons publish no comparable figure in machine-readable form.", volatile: true}
- {id: fin_tax_revenue_per_capita, theme: Public finances, label_en: Municipal tax revenue per resident*, label_de: Steuerertrag pro Einwohner*, unit: CHF per resident, decimals: 0, direction: neutral, aggregation: "ratio:fin_tax_revenue_chf/pop_total", kind: derived, precision: exact, coverage: "partial:ZH,LU,BL", native_level: gemeinde, description: "Municipal tax revenue divided by the STATPOP permanent resident population (31 December of the accounting year)."}
