use: car reach (official travel times, decision D11); PT matrix as sanity check of the GTFS computation
matrix_semantics: >-
  00_NPVM_2023_Datenbezug.pdf: all travel-time/distance matrices are for the average weekday (DWV).
  Car = 'Reisezeit PW (TTC)'; PT = 'Reisezeit OeV (Befoerderungszeit RITA + Zugangszeit ACT +
  Abgangszeit EGT)', 999999 = no PT connection. The sheet does not say whether TTC is the loaded
  (congested) time; TTC is the VISUM skim of the DWV assignment, i.e. most likely the loaded-network
  time of the whole-day (24 h) assignment, so day-average congestion, not peak hour (inference,
  unverified). Peak-hour (MSP 7-8 h) states exist only as VISUM .ver files. No diagonal
  (intrazonal) values; the $O files end with a zone-name block. No zone population is shipped
  (Strukturdaten 2022 on SWISSUbase, registration required) -> STATPOP 2025 hectares as weights.
