- {id: pa_bln_share, theme: Environment & hazards, label_en: Share of area in BLN landscapes, label_de: Anteil Fläche in BLN-Gebieten, unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:pa_bln_ha/pa_municipal_area_ha*100", kind: derived, precision: modelled, coverage: national, native_level: gemeinde}
- {id: pa_parks_share, theme: Environment & hazards, label_en: Share of area in parks of national importance, label_de: Anteil Fläche in Pärken von nationaler Bedeutung, unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:pa_parks_ha/pa_municipal_area_ha*100", kind: derived, precision: modelled, coverage: national, native_level: gemeinde}
- {id: pa_biotopes_share, theme: Environment & hazards, label_en: Share of area in federal biotope inventories, label_de: Anteil Fläche in Biotopinventaren des Bundes, unit: "%", decimals: 1, direction: higher_better, aggregation: "ratio:pa_biotopes_ha/pa_municipal_area_ha*100", kind: derived, precision: modelled, coverage: national, native_level: gemeinde}
