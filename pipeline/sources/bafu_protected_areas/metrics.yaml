# Area in federal inventories and parks (BAFU, current state) per municipality, by polygon overlay
# with swissBOUNDARIES3D 2026-01; planimetric areas, lake parts of municipalities included.
- {id: pa_municipal_area_ha, theme: Environment & hazards, label_en: Municipal area (overlay base), label_de: Gemeindefläche (Verschnittbasis), unit: ha, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Planimetric (2D) area of the municipality polygon (swissBOUNDARIES3D 2026-01, incl. lake parts) used as the denominator of the protected-area shares.", source_note: "Very close to geo_area_total_ha; kept separately so that shares never exceed 100 %."}
- {id: pa_bln_ha, theme: Environment & hazards, label_en: Area in BLN landscapes, label_de: Fläche in BLN-Gebieten, unit: ha, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Area within the Federal Inventory of Landscapes and Natural Monuments of National Importance (BLN, state 2022-11-15)."}
- {id: pa_parks_ha, theme: Environment & hazards, label_en: Area in parks of national importance, label_de: Fläche in Pärken von nationaler Bedeutung, unit: ha, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Area within the Swiss National Park or a park of national importance (regional nature park, nature discovery park; park perimeters, state 2025-04-30).", source_note: "Regional nature parks usually cover whole member municipalities; a park label is not a protection status."}
- {id: pa_biotopes_ha, theme: Environment & hazards, label_en: Area in federal biotope inventories, label_de: Fläche in Biotopinventaren des Bundes, unit: ha, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Area within any of the five federal biotope inventories of national importance (raised bogs, fens, floodplains, amphibian spawning sites, dry grasslands; union, overlaps counted once).", source_note: "States 2022–2026 (latest revision of each inventory). Not included: floodplain annex 2 objects and amphibian migration point objects."}
