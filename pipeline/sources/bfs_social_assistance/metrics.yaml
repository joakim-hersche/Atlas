# BFS Sozialhilfeempfängerstatistik (SHS), economic social assistance in the narrow sense. Period = survey year.
- {id: sh_recipients, theme: Health & social, label_en: Social assistance recipients, label_de: Sozialhilfebeziehende, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, source_note: "All persons in supported units with a payment during the year (cumulative). A unit that moves within the year is counted in each municipality, so sums over municipalities exceed the published canton totals by about 1–2.5 %. 2024–2025 weighted by BFS (modernisation; break in series 2025).", additivity_tolerance: 0.065, additivity_note: "BFS (Map Explorer, indicator description): \"Wer im Verlaufe eines Jahres den Wohnort wechselt und sowohl am alten als auch am neuen Ort Sozialhilfe bezieht, wird zweimal ... gezählt. Bei kantonalen Auswertungen wird dieselbe Unterstützungseinheit nur einmal gezählt ... Demzufolge stimmen die Summen ... aller Gemeinden nicht mit dem Kantonstotal überein.\" Observed for all canton-years with a counted (integer) canton total: municipal sum between +0.0 % and +6.04 % (NW 2012), never below. Non-integer canton totals (GL 2007, AR 2014/15, 2024–2025) are BFS estimates (precision modelled) and are not expected to add up."}
- {id: sh_rate, theme: Health & social, label_en: Social assistance rate, label_de: Sozialhilfequote, unit: "%", decimals: 1, direction: lower_better, aggregation: not_aggregatable, kind: base, precision: exact, coverage: national, native_level: gemeinde, source_note: "As published by BFS: recipients / permanent resident population of the previous year (from 2025: cumulative population of the year). Canton values are kept as published (native). Not re-aggregated because the denominator is not the same-year population."}
- {id: sh_rate_3y, theme: Health & social, label_en: "Social assistance rate (3-year pooled)", label_de: "Sozialhilfequote (3 Jahre gepoolt)", unit: "%", decimals: 1, direction: lower_better, aggregation: "pooled:sh_recipients/pop_total*100:3:1", kind: derived, precision: exact, coverage: national, native_level: gemeinde, description: "Recipients over three consecutive years divided by the sum of the permanent resident populations at the end of each previous year (×100): the average annual rate, stable for small municipalities (decision D32). Uses the pre-2025 BFS denominator for every year (BFS switched to the cumulative population of the year in 2025), so it can differ slightly from the published rate. Above the municipality, recipients are summed over municipalities; a person moving within a year counts in each municipality, so canton values are slightly above the BFS canton rate."}
