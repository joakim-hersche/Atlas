# derived (population from bfs_statpop, 31 December)
- {id: mig_net_intl_swiss_rate, theme: Migration & nationality, label_en: "Net international migration of Swiss per 1000 residents", label_de: "Internationaler Wanderungssaldo Schweizer/innen pro 1000 Einw.", unit: "per 1000 residents", decimals: 1, direction: neutral, aggregation: "ratio:mig_net_intl_swiss/pop_total*1000", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
- {id: mig_net_intl_foreign_rate, theme: Migration & nationality, label_en: "Net international migration of non-Swiss per 1000 residents", label_de: "Internationaler Wanderungssaldo Ausländer/innen pro 1000 Einw.", unit: "per 1000 residents", decimals: 1, direction: neutral, aggregation: "ratio:mig_net_intl_foreign/pop_total*1000", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
- {id: mig_immigration_rate, theme: Migration & nationality, label_en: "Immigration from abroad per 1000 residents", label_de: "Einwanderungen pro 1000 Einw.", unit: "per 1000 residents", decimals: 1, direction: neutral, aggregation: "ratio:mig_immigration_swiss+mig_immigration_foreign/pop_total*1000", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
- {id: mig_emigration_rate, theme: Migration & nationality, label_en: "Emigration abroad per 1000 residents", label_de: "Auswanderungen pro 1000 Einw.", unit: "per 1000 residents", decimals: 1, direction: neutral, aggregation: "ratio:mig_emigration_swiss+mig_emigration_foreign/pop_total*1000", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
- {id: mig_share_foreign_immigrants, theme: Migration & nationality, label_en: "Non-Swiss share of immigrants", label_de: "Ausländeranteil an den Einwanderungen", unit: "%", decimals: 1, direction: neutral, aggregation: "ratio:mig_immigration_foreign/mig_immigration_swiss+mig_immigration_foreign*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
