# BFS PKS: selected Criminal Code offences per 1,000 residents (Häufigkeitszahl) for the 27 cities with >= 30,000 residents, 2009-latest.
# Municipality level, partial coverage (27 cities); published rates, not aggregatable. District rates for all municipalities: bfs_pks.
- {id: pks_city_theft_hz, theme: Safety, label_en: "Theft without shoplifting (Art. 139) per 1,000 residents (cities)", label_de: "Diebstahl ohne Ladendiebstahl (Art. 139 StGB) pro 1000 Einwohner (Städte)", unit: per 1000 residents, decimals: 1, direction: lower_better, aggregation: not_aggregatable, kind: base, precision: exact, coverage: "partial: 27 cities with at least 30,000 residents", native_level: gemeinde, description: "All forms of theft (StGB Art. 139: unspecified, burglary, sneak-in theft, snatching, pickpocketing, trick theft, vehicle theft, theft from and breaking into vehicles, theft by household members) except shoplifting, which some cantons handle in simplified procedures directly through the justice system (BFS). BFS Häufigkeitszahl (HZ): offences registered by the police per 1,000 residents of the permanent resident population at the end of the previous year (STATPOP; ESPOP until 2010). BFS: cities are hubs where many commuters, travellers and visitors are present, so rates of offences against persons may be overstated; the PKS is better suited to trends over time than to geographic comparisons.", source_note: "BFS table je-d-19.02.01.01.04 (Strafgesetzbuch: Auswahl von Straftaten, nach Städten ab 30'000 Einwohner, Häufigkeitszahlen 2009-2025, © BFS 2026, OPEN-BY). 27 cities only (municipality state 6 Apr 2025, back-cast by BFS); other municipalities: see the district rate (bfs_pks). Rates as published (no counts): not aggregatable. 'x' = 1 to 9 offences, withheld for data protection (status suppressed). No Criminal Code total in this table."}
