# BFS commuter matrix (register linkage AHV × STATPOP × STATENT), employed persons in December of
# 2014, 2018, 2020. "Employed" = at least one job with an AHV-liable wage (>= CHF 2,300 per year);
# not the SAKE/PEND definition. Reprojected at flow level to the reference state.
- {id: com_employed_residents, theme: Mobility & accessibility, label_en: Employed residents (commuter matrix), label_de: Erwerbstätige Wohnbevölkerung (Pendlermatrix), unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Employed persons living in the municipality (register linkage AHV/STATPOP/STATENT, December of the year), whatever their place of work in Switzerland.", source_note: "AHV-based definition of employment (wage >= CHF 2,300 per job and year), not the SAKE/commuter-survey definition. Second residence used as residence when it is closer to the workplace."}
- {id: com_jobs, theme: Mobility & accessibility, label_en: Employed persons working in the municipality, label_de: In der Gemeinde arbeitende Erwerbstätige, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Employed persons residing in Switzerland whose (main) workplace is in the municipality. Cross-border commuters living abroad are not included.", source_note: "Workplace of employees of multi-establishment firms (about half of all employed in 2020) assigned by BFS with an optimisation algorithm (minimum total travel time, constrained by STATENT jobs per establishment)."}
- {id: com_work_in_own, theme: Mobility & accessibility, label_en: Residents working in their municipality, label_de: In der Wohngemeinde Arbeitende, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Employed residents whose workplace is in the same municipality (on the reference state, so flows between merged predecessors count as within).", source_note: "Relations below 5 persons are grouped by BFS into code 7777 (other municipalities); where a municipality's own flow is below 5 the value is suppressed. Flows below 5 between predecessors of a merged municipality count as commuting (small undercount)."}
- {id: com_out_commuters, theme: Mobility & accessibility, label_en: Out-commuters, label_de: Wegpendler, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Employed residents working in another municipality (employed residents minus residents working in their municipality)."}
- {id: com_in_commuters, theme: Mobility & accessibility, label_en: In-commuters, label_de: Zupendler, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, description: "Employed persons working in the municipality and living in another Swiss municipality (cross-border commuters from abroad not included)."}
- {id: com_balance, theme: Mobility & accessibility, label_en: Commuter balance, label_de: Pendlersaldo, unit: persons, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, allow_negative: true, description: "Employed persons working in the municipality minus employed residents (= in-commuters minus out-commuters). Positive: net job centre."}
# derived
- {id: com_out_share, theme: Mobility & accessibility, label_en: Out-commuter share, label_de: Wegpendleranteil, unit: "% of employed residents", decimals: 1, direction: neutral, aggregation: "ratio:com_out_commuters/com_employed_residents*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
- {id: com_self_containment, theme: Mobility & accessibility, label_en: Residents working locally (self-containment), label_de: Anteil in der Wohngemeinde Arbeitende, unit: "% of employed residents", decimals: 1, direction: neutral, aggregation: "ratio:com_work_in_own/com_employed_residents*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
- {id: com_in_share, theme: Mobility & accessibility, label_en: In-commuter share of local workers, label_de: Zupendleranteil, unit: "% of persons working in the municipality", decimals: 1, direction: neutral, aggregation: "ratio:com_in_commuters/com_jobs*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde}
- {id: com_job_ratio, theme: Mobility & accessibility, label_en: Workers per 100 employed residents, label_de: Arbeitende pro 100 erwerbstätige Einwohner, unit: "per 100 employed residents", decimals: 0, direction: neutral, aggregation: "ratio:com_jobs/com_employed_residents*100", kind: derived, precision: exact, coverage: national, native_level: gemeinde, bounded_0_100: false}
