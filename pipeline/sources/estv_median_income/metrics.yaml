# Median taxable income per taxpayer, modelled from the ESTV income classes (direct federal tax, normal cases).
# Period = tax year (2020-2023). Municipalities, cantons and Switzerland (cantons and Switzerland from the published class totals).
- {id: "tax_np_median_taxable_income", theme: "Income & tax", label_en: "Median taxable income per taxpayer (estimate)", label_de: "Medianes steuerbares Einkommen pro Steuerpflichtige/n (Schätzung)", unit: "CHF", decimals: 0, direction: "higher_better", aggregation: "not_aggregatable", kind: "base", precision: "modelled", coverage: "national", native_level: "gemeinde", description: "Median of the taxable income (direct federal tax) of the taxpayers of the normal cases, tax units with and without federal tax, a married couple counting once. ESTV publishes only counts in ten income classes (0; 1-30,000; 30,001-40,000; 40,001-50,000; 50,001-75,000; 75,001-100,000; 100,001-200,000; 200,001-500,000; 500,001-1,000,000; above 1,000,000 CHF), so the median is estimated: cumulative counts are interpolated linearly in the logarithm of income inside the class that holds the half-way point (in most municipalities CHF 50,001-75,000). Where tax secrecy hides small cells, the remainder to the published total is spread over them and the value is dropped if the result stays uncertain by more than 5 %. On simulated log-normal incomes the mean absolute error of this estimate is about 0.5 % at 3,000 taxpayers and 1.5 % at 300. Not an official ESTV figure. Taxable income is after deductions and differs from gross wages. Normal cases (ESTV) are taxpayers liable for the whole tax year, resident in the canton and without foreign income; ESTV's special cases (e.g. lump-sum taxation, non-residents liable for property here, part-year liability) are not included, as in the normal-case mean taxable income, which has the same population. It cannot be re-aggregated: districts show no value; for cantons and Switzerland ATLAS estimates it the same way from the class totals ESTV publishes for them.", source_note: "ESTV Statistik der direkten Bundessteuer, natürliche Personen, Gemeinden 2020-2023; estimated by ATLAS (pipeline/sources/estv_median_income/estimate.py)", native_note: "ATLAS estimate from the income classes ESTV publishes for this unit (not an ESTV figure)"}
