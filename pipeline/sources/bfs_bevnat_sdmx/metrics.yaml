- {id: bevnat_birth_rate, theme: Population & demography, label_en: Live births per 1000 residents, label_de: Lebendgeburten pro 1000 Einwohner, unit: per 1000, decimals: 1, direction: neutral, aggregation: "ratio:bevnat_births/pop_total*1000", kind: derived, precision: exact, coverage: national, native_level: gemeinde, source_note: "denominator pop_total (31 Dec) exists from 2010; BFS rates use mean population"}
- {id: bevnat_birth_rate_3y, theme: Population & demography, label_en: "Live births per 1000 residents (3-year pooled)", label_de: "Lebendgeburten pro 1000 Einwohner (3 Jahre gepoolt)", unit: per 1000, decimals: 1, direction: neutral, aggregation: "pooled:bevnat_births/pop_total*1000:3", kind: derived, precision: exact, coverage: national, native_level: gemeinde, description: "Births over three consecutive years divided by the sum of the year-end populations of the same years (×1000). Pooling triples the number of events, so small municipalities get a much more stable rate than the single-year rate (decision D32). Period '2023-2025' = the three years pooled."}
