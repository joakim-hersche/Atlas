# BEVNAT vital events per municipality (totals). base = delivered; derived = computed by the build.
- {id: bevnat_marriages, theme: Households & family, label_en: Marriages, label_de: Heiraten, unit: marriages, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, source_note: "counts 1–3 suppressed by BFS"}
- {id: bevnat_divorces, theme: Households & family, label_en: Divorces, label_de: Scheidungen, unit: divorces, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, source_note: "counts 1–3 suppressed by BFS"}
- {id: bevnat_births, theme: Population & demography, label_en: Live births, label_de: Lebendgeburten, unit: births, decimals: 0, direction: neutral, aggregation: sum, kind: base, precision: exact, coverage: national, native_level: gemeinde, source_note: "counts 1–3 suppressed by BFS"}
# derived (pop_total from bfs_statpop, 31 December; available 2010+)
- {id: bevnat_marriage_rate, theme: Households & family, label_en: Marriages per 1000 residents, label_de: Heiraten pro 1000 Einwohner, unit: per 1000, decimals: 1, direction: neutral, aggregation: "ratio:bevnat_marriages/pop_total*1000", kind: derived, precision: exact, coverage: national, native_level: gemeinde, source_note: "denominator pop_total (31 Dec) exists from 2010; BFS rates use mean population"}
- {id: bevnat_divorce_rate, theme: Households & family, label_en: Divorces per 1000 residents, label_de: Scheidungen pro 1000 Einwohner, unit: per 1000, decimals: 1, direction: neutral, aggregation: "ratio:bevnat_divorces/pop_total*1000", kind: derived, precision: exact, coverage: national, native_level: gemeinde, source_note: "denominator pop_total (31 Dec) exists from 2010; BFS rates use mean population"}
- {id: bevnat_birth_rate, theme: Population & demography, label_en: Live births per 1000 residents, label_de: Lebendgeburten pro 1000 Einwohner, unit: per 1000, decimals: 1, direction: neutral, aggregation: "ratio:bevnat_births/pop_total*1000", kind: derived, precision: exact, coverage: national, native_level: gemeinde, source_note: "denominator pop_total (31 Dec) exists from 2010; BFS rates use mean population"}
