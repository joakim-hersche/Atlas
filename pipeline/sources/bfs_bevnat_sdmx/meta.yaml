title: BEVNAT – marriages, divorces and live births by municipality (SDMX)
publisher: BFS (Federal Statistical Office)
url: https://disseminate.stats.swiss/rest/data/CH1.BEVNAT,DF_BEVNAT_MARIAGES_2,1.0.0/._T._T._T.A
license: "OPEN-BY – open use, the source must be provided (BFS termsOfUse, assets https://www.bfs.admin.ch/asset/en/DF_BEVNAT_MARIAGES_2 etc.)"
attribution: "Source: BFS – Statistik der natürlichen Bevölkerungsbewegung (BEVNAT)"
vintage: SDMX geo codelist CL_KT_BEZ_GDE_SNAP_2025 (state 2025-12-31; BFS re-maps all years to it); mapped to the reference state (mergers only)
