source_id: bfs_bevnat_sdmx
title: BEVNAT – marriages, divorces and live births by municipality (SDMX)
publisher: BFS (Federal Statistical Office)
url: https://disseminate.stats.swiss/rest/data/CH1.BEVNAT,DF_BEVNAT_MARIAGES_2,1.0.0/._T._T._T.A
license: "OPEN-BY – open use, the source must be provided (BFS termsOfUse, assets https://www.bfs.admin.ch/asset/en/DF_BEVNAT_MARIAGES_2 etc.)"
attribution: "Source: BFS – Statistik der natürlichen Bevölkerungsbewegung (BEVNAT)"
vintage: SDMX geo codelist CL_KT_BEZ_GDE_SNAP_2025 (state 2025-12-31; BFS re-maps all years to it); mapped to the reference state (mergers only)
years: 1969–2025
dataflows: [CH1.BEVNAT DF_BEVNAT_MARIAGES_2 1.0.0, CH1.BEVNAT DF_BEVNAT_DIVORCES_3 1.0.0, CH1.BEVNAT DF_BEVNAT_NAISSANCES_1 1.0.0]
client: pipeline/sources/bfs_sdmx
inputs: [bfs_bevnat_bilanz]
catalog_ids: [bfs_bevnat_marriage_divorce, bfs_sdmx_bevnat_births_deaths]
notes: >-
  Counts of 1 to 3 are suppressed (status suppressed), about 500 municipalities per year and series.
  Births suppressed here (1–3) are filled from 1981 with the demographic balance (bfs_bevnat_bilanz),
  which publishes every municipality (audit round 2, M6). The birth rate uses the mean population of the
  year (1 January and 31 December, demographic balance), as BFS does, and exists from 1981.
