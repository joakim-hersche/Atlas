notes: >-
  Counts of 1 to 3 are suppressed (status suppressed), about 500 municipalities per year and series.
  Per-1000 rates are derived with pop_total (STATPOP, 31 December, bfs_statpop) and therefore exist
  only from 2010; for 1969–2009 only the counts are available here. BFS's official crude rates use
  the mean population of the year, so ours differ slightly.
