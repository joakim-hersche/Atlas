source_id: bfs_gws
title: Buildings and dwellings statistics (GWS) by municipality – category, construction period, heating, rooms, floor area
publisher: BFS (Federal Statistical Office), based on the Federal Register of Buildings and Dwellings (GWR)
url: https://disseminate.stats.swiss/rest/data/CH1.GWS,DF_GWS_REG1,1.1.0/A..._T
license: "OPEN-BY – open use, the source must be provided (BFS termsOfUse, assets https://www.bfs.admin.ch/asset/en/DF_GWS_REG1 etc.)"
attribution: "Source: BFS – Gebäude- und Wohnungsstatistik (GWS)"
vintage: SDMX geo codelist CL_KT_BEZ_GDE_SNAP_2025_DIFF (state 2025-12-31, history re-mapped by BFS); mapped to the reference state (mergers only)
years: 2010–2025 (31 December); heating energy source 2021–2025; floor-area classes 2012–2025
dataflows: [CH1.GWS DF_GWS_REG1 1.1.0, CH1.GWS DF_GWS_REG3 1.1.0, CH1.GWS DF_GWS_REG5 1.1.0, CH1.GWS DF_GWS_REG7 1.1.0]
client: pipeline/sources/bfs_sdmx
catalog_ids: [bfs_gws_sdmx]
notes: >-
  Buildings are buildings with residential use (categories single-family, multi-family, residential
  with subsidiary use, partly residential). Construction periods aggregated to before 1919, 1919–1945,
  1946–1980, 1981–2000, 2001–2010, 2011+ (the last class is open: 2021–2025 is still filling up).
  Heating = main heat generator's energy source for space heating; 'other' = solar thermal + others.
  The six floor-area classes sum to the dwelling total (checked for Switzerland 2025).
