- {id: reach_pt_zuerich, theme: Mobility & accessibility, label_en: "Public transport to Zürich HB", label_de: "ÖV-Reisezeit nach Zürich HB", unit: min, decimals: 0, direction: lower_better, aggregation: not_aggregatable, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Public transport travel time from Zürich HB (main station) to the municipality, weekday morning (population-weighted median over the municipality's inhabited hectares).", source_note: "Journey time as journey planners show it (initial wait at the hub excluded); median over the 61 departure minutes 07:30-08:30 of the GTFS service day. Municipalities with no populated hectare within 1.5 km of a served stop have no value."}
