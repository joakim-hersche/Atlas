- {id: reach_pt_baden, theme: "Mobility & accessibility", label_en: "Public transport door-to-door to Baden", label_de: "ÖV Tür-zu-Tür nach Baden", unit: min, decimals: 0, direction: lower_better, aggregation: not_aggregatable, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Public transport travel time from where people live in the municipality to Baden, weekday morning arrivals 07:30-08:30, including the walk to the best stop (population-weighted median over inhabited hectares).", source_note: "Each inhabited STATPOP 2025 hectare walks (straight line x 1.3, 1.2 m/s) to the best stop within 1.5 km (minimum over stops of walk + that stop's median journey to the hub); municipality value = population-weighted median. Arrivals 07:30-08:30 at the hub, as for the station time. Municipalities with no inhabited hectare within 1.5 km of a served stop have no value."}
- {id: reach_car_baden, theme: "Mobility & accessibility", label_en: "Car to Baden", label_de: "Autofahrzeit nach Baden", unit: min, decimals: 0, direction: lower_better, aggregation: not_aggregatable, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Car travel time from the municipality to Baden (hub zone), average weekday model incl. congestion (NPVM 2023, population-weighted).", source_note: "NPVM 2023 car travel time matrix (ARE, CC-BY 4.0), travel time in the loaded network (TTC) of the average-weekday assignment, column towards the hub zone (same direction as public transport); zone values weighted by STATPOP 2025 hectare population.", credit_source: are_npvm}
- {id: reach_ptst_nearest_hub, theme: "Mobility & accessibility", label_en: "Train/PT station time to the nearest hub", label_de: "ÖV-Fahrzeit ab Bahnhof zum nächsten Zentrum", unit: min, decimals: 0, direction: lower_better, aggregation: not_aggregatable, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Shortest station time to any of the 15 hubs (minimum over hubs; the hub is named in the note). Hubs: the main station of the core city of every agglomeration (BFS 2020 definition) with at least 100,000 residents (STATPOP 2025): Zürich HB, Genève, Basel SBB, Lausanne, Bern, Luzern, St. Gallen, Lugano, Winterthur, Zug, Baden, Aarau, Neuchâtel, Biel/Bienne, Olten. The other reach stations (Bellinzona, Chur, Fribourg, Sion, Schaffhausen, Thun) do not count here.", source_note: "Median over the 61 arrival minutes 07:30-08:30 at the hub on three weekdays (Tue 17 Nov, Wed 25 Nov, Thu 3 Dec 2026, GTFS timetable 2026; per station the median day): for each arrival minute the latest departure that still arrives in time; journey = actual arrival - departure, as journey planners show it (no initial wait, no wait at the hub). Where the hub cannot be reached by 08:30 (first trains of the day), the hour from the earliest possible arrival is used (stated in the note)."}
- {id: reach_pt_nearest_hub, theme: "Mobility & accessibility", label_en: "Public transport door-to-door to the nearest hub", label_de: "ÖV Tür-zu-Tür zum nächsten Zentrum", unit: min, decimals: 0, direction: lower_better, aggregation: not_aggregatable, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Shortest door-to-door public transport time to any of the 15 hubs (minimum over hubs; the hub is named in the note). Hubs: the main station of the core city of every agglomeration (BFS 2020 definition) with at least 100,000 residents (STATPOP 2025): Zürich HB, Genève, Basel SBB, Lausanne, Bern, Luzern, St. Gallen, Lugano, Winterthur, Zug, Baden, Aarau, Neuchâtel, Biel/Bienne, Olten. The other reach stations (Bellinzona, Chur, Fribourg, Sion, Schaffhausen, Thun) do not count here.", source_note: "Each inhabited STATPOP 2025 hectare walks (straight line x 1.3, 1.2 m/s) to the best stop within 1.5 km (minimum over stops of walk + that stop's median journey to the hub); municipality value = population-weighted median. Arrivals 07:30-08:30 at the hub, as for the station time. Municipalities with no inhabited hectare within 1.5 km of a served stop have no value."}
