- {id: reach_pt_chur, theme: "Mobility & accessibility", label_en: "Public transport door-to-door to Chur", label_de: "ÖV Tür-zu-Tür nach Chur", unit: min, decimals: 0, direction: lower_better, aggregation: not_aggregatable, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Public transport travel time from where people live in the municipality to Chur, weekday morning arrivals 07:30-08:30, including the walk to the best stop (population-weighted median over inhabited hectares).", source_note: "Each inhabited STATPOP 2025 hectare walks (straight line x 1.3, 1.2 m/s) to the best stop within 1.5 km (minimum over stops of walk + that stop's median journey to the hub); municipality value = population-weighted median. Arrivals 07:30-08:30 at the hub, as for the station time. Municipalities with no inhabited hectare within 1.5 km of a served stop have no value."}
