# Travel times between the 21 reach hubs (decisions D9, D39) and each municipality, built by pipeline/reach.
# Public transport (decision D31), towards the hub, arrivals at the hub 07:30-08:30, median day of Tue 17 Nov, Wed 25 Nov, Thu 3 Dec 2026 (GTFS 2026):
#   reach_ptst_<hub>  station time: timetable journey from the municipality's main station to the hub station
#   reach_pt_<hub>    door-to-door: inhabited hectares walk to the best stop within 1.5 km, population-weighted median
# Car: ARE NPVM 2023 (average weekday model incl. congestion), towards the hub (matrix column), population-weighted over zones (credited to are_npvm).
# reach_*_nearest_hub: minimum over the 15 nearest-hub stations only (D39, pipeline.reach.hubs.nearest_hubs()).
# Hub-outward PT times (the growing-lines drawing) stay in data/interim/reach/travel_times.parquet only.
- {id: reach_ptst_zuerich, theme: "Mobility & accessibility", label_en: "Train/PT station time to Zürich HB", label_de: "ÖV-Fahrzeit ab Bahnhof nach Zürich HB", unit: min, decimals: 0, direction: lower_better, aggregation: not_aggregatable, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Timetable journey time from the municipality's main station to Zürich HB, weekday morning arrivals 07:30-08:30 (as in a journey planner). Main station: the station in the municipality that serves the most residents within 1.5 km, rail preferred (named in the profile; a station time from a bus or boat stop says so).", source_note: "Median over the 61 arrival minutes 07:30-08:30 at the hub on three weekdays (Tue 17 Nov, Wed 25 Nov, Thu 3 Dec 2026, GTFS timetable 2026; per station the median day): for each arrival minute the latest departure that still arrives in time; journey = actual arrival - departure, as journey planners show it (no initial wait, no wait at the hub). Where the hub cannot be reached by 08:30 (first trains of the day), the hour from the earliest possible arrival is used (stated in the note)."}
- {id: reach_pt_zuerich, theme: "Mobility & accessibility", label_en: "Public transport door-to-door to Zürich HB", label_de: "ÖV Tür-zu-Tür nach Zürich HB", unit: min, decimals: 0, direction: lower_better, aggregation: not_aggregatable, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Public transport travel time from where people live in the municipality to Zürich HB, weekday morning arrivals 07:30-08:30, including the walk to the best stop (population-weighted median over inhabited hectares).", source_note: "Each inhabited STATPOP 2025 hectare walks (straight line x 1.3, 1.2 m/s) to the best stop within 1.5 km (minimum over stops of walk + that stop's median journey to the hub); municipality value = population-weighted median. Arrivals 07:30-08:30 at the hub, as for the station time. Municipalities with no inhabited hectare within 1.5 km of a served stop have no value."}
- {id: reach_car_zuerich, theme: "Mobility & accessibility", label_en: "Car to Zürich HB", label_de: "Autofahrzeit nach Zürich HB", unit: min, decimals: 0, direction: lower_better, aggregation: not_aggregatable, kind: base, precision: modelled, coverage: national, native_level: gemeinde, description: "Car travel time from the municipality to Zürich HB (hub zone), average weekday model incl. congestion (NPVM 2023, population-weighted).", source_note: "NPVM 2023 car travel time matrix (ARE, CC-BY 4.0), travel time in the loaded network (TTC) of the average-weekday assignment, column towards the hub zone (same direction as public transport); zone values weighted by STATPOP 2025 hectare population.", credit_source: are_npvm}
