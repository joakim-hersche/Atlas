# (excerpts: scratchpad samples/licences/estv_bag_recheck_2026-11-10.txt)

estv_tax_burden:
  status: blocked
  missing: "A reuse statement that covers the ESTV tax calculator exports (income-tax-values)."
  evidence: "Held back, not refused. Calculator footer 'Rechtliches' links only https://www.admin.ch/gov/de/start/rechtliches.html (proxy 403, unreadable). No reuse text on https://www.estv.admin.ch/de/steuerbelastung-in-den-gemeinden, https://www.estv.admin.ch/de/impressum-estv, the Steckbrief 'Steuerbelastung in der Schweiz' (12.06.2025), the calculator bundle or the exported xlsx (sheet 'Export' only). The quote 'Wiedergabe unter Angabe der Quelle für Nutzung gestattet' is the colophon of the direct federal tax statistics files (estv_dbst, sheet 'Erläuterungen', © ESTV Oktober 2025), not of these exports. The only Steuerbelastung colophon found (2012 PDF, © BFS 2013) reads 'Abdruck – ausser für kommerzielle Nutzung – unter Angabe der Quelle gestattet' and covers that publication only. Checked 2026-11-10."

estv_tax_multipliers:
  status: blocked
  missing: "A reuse statement that covers the ESTV tax calculator export income-tax-rates."
  evidence: "Same calculator and terms link as estv_tax_burden. https://www.estv.admin.ch/de/steuerfuesse-abzuege-und-tarife-der-schweiz and its file steuerfuesse-np-1995-2026.xlsx (capitals only) carry no reuse statement. Checked 2026-11-10."

bag_premiums:
  status: blocked
  missing: "The licence of opendata.swiss dataset health-insurance-premiums (where priminfo says the data is published)."
  evidence: "https://www.priminfo.admin.ch/de/downloads/aktuell: 'Prämiendaten sind als Excel- und CSV-Datei unter opendata.swiss verfügbar' -> https://opendata.swiss/de/dataset/health-insurance-premiums (403 from the session). priminfo has no imprint/terms page (404); BAG pages link 'Rechtliches' to admin.ch (403). Cached PDFs/xlsx carry no licence. Checked 2026-11-10."

bfs_rents:
  status: cleared
  evidence: "BFS asset pages https://statistik.admin.ch/de/asset/36398431 (rent by canton), /36398447 (rent per m2 by canton) and /36503090 (SSV cities, 2026 edition): 'Nutzungsbedingungen OPEN-BY Freie Nutzung - Quellenangabe ist Pflicht'. Files carry '© BFS 2026' and 'Quellen: BFS – SE, GWS'. Checked 2026-11-10."
