  status: cleared
  evidence: "STAC https://data.geo.admin.ch/api/stac/v1/collections/ch.swisstopo-vd.ortschaftenverzeichnis_plz: licence field 'proprietary', link rel=license 'Terms of use' https://www.swisstopo.admin.ch/ogd-conditions, which redirects to https://www.swisstopo.admin.ch/en/terms-of-use-free-geodata-and-geoservices: 'The free geodata and geoservices of swisstopo may be used, distributed and made accessible. Furthermore, they may be enriched and processed and also used commercially. A reference to the source is mandatory.' Accepted references include '©swisstopo'. The exceptions list (other wording required) names only swissALTI Regio and swissEO. Collection description: 'The data set covers all of Switzerland and is available free of charge.' Checked 2026-11-10."

wikidata_cantons:
  status: cleared
  evidence: "Wikidata structured data are CC0 1.0 (Wikidata:Licensing), the basis already recorded for wikidata_identity. www.wikidata.org is blocked by the session proxy (403, 2026-11-10), so the licensing page was not re-read in this pass; only item labels and ISO 3166-2 codes from query.wikidata.org are used."

