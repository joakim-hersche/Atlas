  - {en: "median class not determinable: small cells suppressed by tax secrecy", de: "Medianklasse nicht bestimmbar: kleine Zellen wegen des Steuergeheimnisses unterdrückt", fr: "classe médiane indéterminable : petites cellules masquées en raison du secret fiscal"}
