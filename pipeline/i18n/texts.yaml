  - {en: "no transaction of residential building land this year (BL)", de: "keine Handänderung von Wohnbauland in diesem Jahr (BL)", fr: "aucune transaction de terrain à bâtir résidentiel cette année (BL)"}
  - {en: "FR delivers neither the survey perimeter nor 'not endangered' areas: assessed perimeter unknown", de: "FR liefert weder den Untersuchungsperimeter noch die Flächen «nicht gefährdet»: beurteilter Perimeter unbekannt", fr: "FR ne livre ni le périmètre d'étude ni les surfaces « non menacées » : périmètre évalué inconnu"}
