  - {en: "computed from the commuter matrix flows: employed residents working in another canton", de: "aus den Strömen der Pendlermatrix berechnet: Erwerbstätige, die in einem anderen Kanton arbeiten", fr: "calculé à partir des flux de la matrice des pendulaires : actifs occupés travaillant dans un autre canton"}
  - {en: "no Energiestadt label", de: "kein Label Energiestadt", fr: "pas de label Cité de l'énergie"}
  - {en: "self-financing ratio not computable (net investments ≤ 0 or negative self-financing; source shows no value)", de: "Selbstfinanzierungsgrad nicht berechenbar (Nettoinvestitionen ≤ 0 oder negative Selbstfinanzierung; die Quelle zeigt keinen Wert)", fr: "degré d'autofinancement non calculable (investissements nets ≤ 0 ou autofinancement négatif ; la source n'indique pas de valeur)"}
