  - {en: "published district value", de: "veröffentlichter Wert des Bezirks", fr: "valeur publiée du district"}
  - {en: "published national value", de: "veröffentlichter Wert der Schweiz", fr: "valeur publiée pour la Suisse"}
  - {en: "published major-region value", de: "veröffentlichter Wert der Grossregion", fr: "valeur publiée de la grande région"}
  - {en: "the territory has changed since", de: "das Gebiet hat sich seither verändert", fr: "le territoire a changé depuis"}
  - {en: "the territory has changed since, so it is not used", de: "das Gebiet hat sich seither verändert, deshalb wird er nicht verwendet", fr: "le territoire a changé depuis, elle n'est donc pas utilisée"}
  - {en: "computed from published values (municipal values incomplete)", de: "aus veröffentlichten Werten berechnet (Gemeindewerte unvollständig)", fr: "calculé à partir de valeurs publiées (valeurs communales incomplètes)"}
  - {en: "computed from the published totals of the source", de: "aus den veröffentlichten Totalen der Quelle berechnet", fr: "calculé à partir des totaux publiés par la source"}
  - {en: "published total of the source; it can differ slightly from the sum of the municipalities", de: "veröffentlichtes Total der Quelle; es kann leicht von der Summe der Gemeinden abweichen", fr: "total publié par la source ; il peut différer légèrement de la somme des communes"}
  - {en: "published total (ESTV); ESTV notes that the sum of the municipalities can differ from it because cells are hidden for tax secrecy", de: "veröffentlichtes Total (ESTV); laut ESTV kann die Summe der Gemeinden davon abweichen, weil Zellen wegen des Steuergeheimnisses verborgen sind", fr: "total publié (AFC) ; selon l'AFC, la somme des communes peut en différer, car des cellules sont masquées en raison du secret fiscal"}
  - {en: "ATLAS estimate from the income classes ESTV publishes for this unit (not an ESTV figure)", de: "Schätzung von ATLAS aus den Einkommensklassen, welche die ESTV für diese Einheit veröffentlicht (keine Zahl der ESTV)", fr: "estimation d'ATLAS à partir des classes de revenu que l'AFC publie pour cette unité (pas un chiffre de l'AFC)"}
  - {en: "excludes amounts not allocatable to a municipality (in canton and Swiss totals only)", de: "ohne Beträge, die keiner Gemeinde zugeordnet werden können (nur in den Totalen der Kantone und der Schweiz enthalten)", fr: "sans les montants non attribuables à une commune (compris seulement dans les totaux des cantons et de la Suisse)"}
  - {en: "includes units outside municipalities (pseudo-units)", de: "einschliesslich Einheiten ausserhalb der Gemeinden (Pseudo-Einheiten)", fr: "y compris des unités hors communes (pseudo-unités)"}
