  - {en: "not covered", de: "nicht erfasst", fr: "non couvert"}
  - {en: "no data", de: "keine Daten", fr: "pas de données"}
  - {en: "not published at this level", de: "auf dieser Ebene nicht veröffentlicht", fr: "non publié à ce niveau"}
  - {en: "not applicable", de: "nicht zutreffend", fr: "sans objet"}
  - {en: "published value", de: "veröffentlichter Wert", fr: "valeur publiée"}
