  - {en: "technical denominator of the Structural Survey language shares of the statistical cities", de: "technische Bezugsgrösse der Sprachanteile der Strukturerhebung für die statistischen Städte", fr: "dénominateur technique des parts linguistiques du relevé structurel pour les villes statistiques"}
  - {en: "technical denominator of the commuting shares", de: "technische Bezugsgrösse der Pendleranteile", fr: "dénominateur technique des parts de pendulaires"}
