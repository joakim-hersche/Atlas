patterns:
  # ---- counts of missing municipalities (pipeline/build/metrics.py) --------------------------------------
  - {en: '1 of ([\d,]+) municipalities without a value: (.+)', de: '1 von {1|n} Gemeinden ohne Wert: {2|l}', fr: '1 commune sur {1|n} sans valeur : {2|l}'}
  - {en: '1 suppressed \(small numbers\)', de: '1 unterdrückt (kleine Zahlen)', fr: '1 masquée (petits nombres)'}
  - {en: '1 not published', de: '1 nicht veröffentlicht', fr: '1 non publiée'}
  - {en: '1 not covered', de: '1 nicht erfasst', fr: '1 non couverte'}
