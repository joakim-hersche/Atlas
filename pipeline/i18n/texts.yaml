# German and French for the texts the pipeline writes into the app's data: value notes, gap reasons, curation
# reasons, reach footnotes (review round 3, A4). Read by pipeline/build/texts.py, shipped as data/out/web/texts.json.
#
# exact:    whole texts (or "; "-separated parts of a text) translated as they are
# patterns: an English regular expression matching a whole text or part; templates insert its groups:
#           {1} as is, {1|n} number in the language's format (1,234.5 -> 1'234.5 / 1 234,5),
#           {1|t} translated again (a nested text), {1|l} a ", " list translated item by item.
# Regexes use numbered groups only (the frontend runs them in JavaScript too). Place, station and hub names,
# canton codes, party abbreviations, dates and times stay as they are. Swiss German: "ss", never "ß".

exact:
  # ---- statuses and generic reasons --------------------------------------------------------------------
  - {en: "cannot be aggregated", de: "nicht aggregierbar", fr: "non agrégeable"}
  - {en: "no published value at this level", de: "kein veröffentlichter Wert auf dieser Ebene", fr: "aucune valeur publiée à ce niveau"}
  - {en: "no data at this level", de: "keine Daten auf dieser Ebene", fr: "pas de données à ce niveau"}
