  - {"en": "a percentage of each canton's simple tax, so it compares municipalities within one canton only; only canton Zürich is covered: shown on the profiles of Zürich municipalities, never as a map", "de": "ein Prozentsatz der einfachen Steuer des jeweiligen Kantons, deshalb nur innerhalb eines Kantons vergleichbar; erfasst ist nur der Kanton Zürich: in den Profilen der Zürcher Gemeinden, nie als Karte", "fr": "un pourcentage de l'impôt simple de chaque canton, donc comparable seulement à l'intérieur d'un canton ; seul le canton de Zurich est couvert : affiché dans les profils des communes zurichoises, jamais comme carte"}
