# --- estv_median_income ---
tax_np_median_taxable_income: {"label_fr": "Revenu imposable médian par contribuable (estimation)", "unit_en": "CHF", "unit_de": "CHF", "unit_fr": "CHF", "description_de": "Median des steuerbaren Einkommens (direkte Bundessteuer) der Normalfälle, mit und ohne Bundessteuer; ein Ehepaar zählt einmal. Die ESTV veröffentlicht nur Anzahlen in zehn Einkommensklassen; der Median wird deshalb geschätzt: die kumulierten Anzahlen werden innerhalb der Klasse mit dem Mittelpunkt linear im Logarithmus des Einkommens interpoliert. Wo das Steuergeheimnis kleine Zellen verbirgt, wird der Rest zum veröffentlichten Total auf sie verteilt; bleibt das Ergebnis um mehr als 5 % unsicher, entfällt der Wert. An simulierten log-normalen Einkommen beträgt der mittlere absolute Fehler etwa 0,5 % bei 3000 und 1,5 % bei 300 Steuerpflichtigen. Keine offizielle Zahl der ESTV. Das steuerbare Einkommen ist nach Abzügen und nicht der Bruttolohn. Normalfälle (ESTV): während des ganzen Steuerjahres steuerpflichtig, mit Wohnsitz im Kanton, ohne Auslandseinkommen; die Sonderfälle der ESTV (z. B. Besteuerung nach dem Aufwand, Personen ohne Wohnsitz mit einem Grundstück hier, unterjährige Steuerpflicht) sind nicht enthalten, wie beim Mittelwert der Normalfälle mit derselben Grundgesamtheit. Nicht aggregierbar: Bezirke ohne Wert; für Kantone und die Schweiz schätzt ATLAS ihn gleich aus den Klassentotalen, welche die ESTV für sie veröffentlicht.", "description_fr": "Médiane du revenu imposable (impôt fédéral direct) des cas normaux, avec et sans impôt fédéral ; un couple marié compte une fois. L'AFC ne publie que des effectifs par dix classes de revenu ; la médiane est donc estimée : les effectifs cumulés sont interpolés linéairement dans le logarithme du revenu à l'intérieur de la classe qui contient le point médian. Là où le secret fiscal masque de petites cellules, le reste jusqu'au total publié leur est réparti ; si le résultat reste incertain de plus de 5 %, la valeur est omise. Sur des revenus log-normaux simulés, l'erreur absolue moyenne est d'environ 0,5 % pour 3000 contribuables et de 1,5 % pour 300. Ce n'est pas un chiffre officiel de l'AFC. Le revenu imposable s'entend après déductions et diffère du salaire brut. Cas normaux (AFC) : assujettis pendant toute l'année fiscale, domiciliés dans le canton, sans revenus étrangers ; les cas spéciaux de l'AFC (p. ex. imposition d'après la dépense, personnes sans domicile possédant un immeuble ici, assujettissement en cours d'année) ne sont pas inclus, comme pour la moyenne des cas normaux, qui a la même population. Non agrégeable : pas de valeur pour les districts ; pour les cantons et la Suisse, ATLAS l'estime de la même manière à partir des totaux par classe que l'AFC publie pour eux."}

