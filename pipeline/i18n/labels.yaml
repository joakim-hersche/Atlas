tax_np_share_no_federal_tax: {"label_fr": "Part des contribuables ne payant pas d'impôt fédéral direct, tous les contribuables y c. cas spéciaux (AFC)", "unit_en": "%", "unit_de": "%", "unit_fr": "%", "description_de": "Steuerpflichtige ohne direkte Bundessteuer (Einkommen nach Abzügen unter der Steuergrenze), in Prozent aller Steuerpflichtigen, Normal- und Sonderfälle. Sonderfälle der ESTV (ab 2020 «Übrige Sonderfälle») sind gemäss Einleitung der ESTV-Gemeindetabellen: Besteuerung nach dem Aufwand (Art. 14 DBG), Personen ohne Wohnsitz in der Schweiz, die für einen Geschäftsbetrieb, eine Betriebsstätte oder ein Grundstück hier steuerpflichtig sind (Art. 4–5), Personen, deren steuerbares und satzbestimmendes Einkommen wegen Auslandseinkommen verschieden sind (Art. 7), sowie Steuerpflicht während eines Teils des Jahres (Art. 40). Ihr steuerbares Einkommen in der Gemeinde kann klein sein (z. B. nur ein Grundstück in der Schweiz); wo sie zahlreich sind, etwa in Ferienorten mit vielen Zweitwohnungen, liegt der Mittelwert aller Fälle deshalb weit unter jenem der Normalfälle. Anteil der Normalfälle: eigene Kennzahl (2020–2023). Verfügbar 2003–2023.", "description_fr": "Contribuables ne devant pas d'impôt fédéral direct (revenu après déductions inférieur au seuil d'imposition), en pour-cent de tous les contribuables, cas normaux et spéciaux. Les cas spéciaux de l'AFC (dès 2020 « Autres cas spéciaux ») sont, selon l'introduction des tableaux communaux de l'AFC : l'imposition d'après la dépense (art. 14 LIFD), les personnes sans domicile en Suisse assujetties pour une entreprise, un établissement stable ou un immeuble situé ici (art. 4–5), les personnes dont le revenu imposable et le revenu déterminant le taux diffèrent en raison de revenus étrangers (art. 7), ainsi que l'assujettissement pendant une partie de l'année (art. 40). Leur revenu imposable dans la commune peut être faible (p. ex. un seul immeuble en Suisse) ; là où ils sont nombreux, comme dans les stations aux nombreuses résidences secondaires, la moyenne de tous les cas est donc bien inférieure à celle des cas normaux. Part des cas normaux : indicateur distinct (2020–2023). Disponible 2003–2023."}
tax_np_federal_tax_per_capita: {label_fr: "Rendement de l'impôt fédéral direct par habitant", unit_en: "CHF per resident", unit_de: "CHF pro Einwohner", unit_fr: "CHF par habitant"}
tax_np_federal_tax_per_taxpayer: {"label_fr": "Impôt fédéral direct par contribuable, tous les contribuables y c. cas spéciaux (AFC)", "unit_en": "CHF", "unit_de": "CHF", "unit_fr": "CHF", "description_de": "Ertrag der direkten Bundessteuer der natürlichen Personen (Normal- und Sonderfälle), geteilt durch die Zahl aller Steuerpflichtigen, mit und ohne Bundessteuer. Sonderfälle der ESTV (ab 2020 «Übrige Sonderfälle») sind gemäss Einleitung der ESTV-Gemeindetabellen: Besteuerung nach dem Aufwand (Art. 14 DBG), Personen ohne Wohnsitz in der Schweiz, die für einen Geschäftsbetrieb, eine Betriebsstätte oder ein Grundstück hier steuerpflichtig sind (Art. 4–5), Personen, deren steuerbares und satzbestimmendes Einkommen wegen Auslandseinkommen verschieden sind (Art. 7), sowie Steuerpflicht während eines Teils des Jahres (Art. 40). Ihr steuerbares Einkommen in der Gemeinde kann klein sein (z. B. nur ein Grundstück in der Schweiz); wo sie zahlreich sind, etwa in Ferienorten mit vielen Zweitwohnungen, liegt der Mittelwert aller Fälle deshalb weit unter jenem der Normalfälle. Verfügbar 2003–2023.", "description_fr": "Rendement de l'impôt fédéral direct des personnes physiques (cas normaux et spéciaux), divisé par le nombre de tous les contribuables, avec et sans impôt fédéral. Les cas spéciaux de l'AFC (dès 2020 « Autres cas spéciaux ») sont, selon l'introduction des tableaux communaux de l'AFC : l'imposition d'après la dépense (art. 14 LIFD), les personnes sans domicile en Suisse assujetties pour une entreprise, un établissement stable ou un immeuble situé ici (art. 4–5), les personnes dont le revenu imposable et le revenu déterminant le taux diffèrent en raison de revenus étrangers (art. 7), ainsi que l'assujettissement pendant une partie de l'année (art. 40). Leur revenu imposable dans la commune peut être faible (p. ex. un seul immeuble en Suisse) ; là où ils sont nombreux, comme dans les stations aux nombreuses résidences secondaires, la moyenne de tous les cas est donc bien inférieure à celle des cas normaux. Disponible 2003–2023."}

