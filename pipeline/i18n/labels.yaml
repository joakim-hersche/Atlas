tax_np_mean_net_income: {"label_fr": "Revenu net moyen, tous les contribuables y c. cas spéciaux (AFC)", "unit_en": "CHF", "unit_de": "CHF", "unit_fr": "CHF", "description_de": "Reines Einkommen (direkte Bundessteuer) aller Steuerpflichtigen, Normal- und Sonderfälle, mit und ohne Bundessteuer, geteilt durch ihre Zahl; ein Ehepaar zählt einmal. Sonderfälle der ESTV (ab 2020 «Übrige Sonderfälle») sind gemäss Einleitung der ESTV-Gemeindetabellen: Besteuerung nach dem Aufwand (Art. 14 DBG), Personen ohne Wohnsitz in der Schweiz, die für einen Geschäftsbetrieb, eine Betriebsstätte oder ein Grundstück hier steuerpflichtig sind (Art. 4–5), Personen, deren steuerbares und satzbestimmendes Einkommen wegen Auslandseinkommen verschieden sind (Art. 7), sowie Steuerpflicht während eines Teils des Jahres (Art. 40). Ihr steuerbares Einkommen in der Gemeinde kann klein sein (z. B. nur ein Grundstück in der Schweiz); wo sie zahlreich sind, etwa in Ferienorten mit vielen Zweitwohnungen, liegt der Mittelwert aller Fälle deshalb weit unter jenem der Normalfälle. Für den Vergleich der Einkommen der Einwohnerinnen und Einwohner den Mittelwert der Normalfälle verwenden (2020–2023). Verfügbar 2008–2023.", "description_fr": "Revenu net (impôt fédéral direct) de tous les contribuables, cas normaux et spéciaux, avec et sans impôt fédéral, divisé par leur nombre ; un couple marié compte une fois. Les cas spéciaux de l'AFC (dès 2020 « Autres cas spéciaux ») sont, selon l'introduction des tableaux communaux de l'AFC : l'imposition d'après la dépense (art. 14 LIFD), les personnes sans domicile en Suisse assujetties pour une entreprise, un établissement stable ou un immeuble situé ici (art. 4–5), les personnes dont le revenu imposable et le revenu déterminant le taux diffèrent en raison de revenus étrangers (art. 7), ainsi que l'assujettissement pendant une partie de l'année (art. 40). Leur revenu imposable dans la commune peut être faible (p. ex. un seul immeuble en Suisse) ; là où ils sont nombreux, comme dans les stations aux nombreuses résidences secondaires, la moyenne de tous les cas est donc bien inférieure à celle des cas normaux. Pour comparer les revenus des habitants, utiliser la moyenne des cas normaux (2020–2023). Disponible 2008–2023."}
tax_np_mean_taxable_income: {"label_fr": "Revenu imposable moyen, tous les contribuables y c. cas spéciaux (AFC)", "unit_en": "CHF", "unit_de": "CHF", "unit_fr": "CHF", "description_de": "Steuerbares Einkommen (direkte Bundessteuer) aller Steuerpflichtigen, Normal- und Sonderfälle, mit und ohne Bundessteuer, geteilt durch ihre Zahl; ein Ehepaar zählt einmal. Sonderfälle der ESTV (ab 2020 «Übrige Sonderfälle») sind gemäss Einleitung der ESTV-Gemeindetabellen: Besteuerung nach dem Aufwand (Art. 14 DBG), Personen ohne Wohnsitz in der Schweiz, die für einen Geschäftsbetrieb, eine Betriebsstätte oder ein Grundstück hier steuerpflichtig sind (Art. 4–5), Personen, deren steuerbares und satzbestimmendes Einkommen wegen Auslandseinkommen verschieden sind (Art. 7), sowie Steuerpflicht während eines Teils des Jahres (Art. 40). Ihr steuerbares Einkommen in der Gemeinde kann klein sein (z. B. nur ein Grundstück in der Schweiz); wo sie zahlreich sind, etwa in Ferienorten mit vielen Zweitwohnungen, liegt der Mittelwert aller Fälle deshalb weit unter jenem der Normalfälle. Für den Vergleich der Einkommen der Einwohnerinnen und Einwohner den Mittelwert der Normalfälle verwenden, der dieselbe Grundgesamtheit hat wie der Median (2020–2023); diese Reihe reicht bis 2008 zurück. Das steuerbare Einkommen ist nach Abzügen und nicht der Bruttolohn.", "description_fr": "Revenu imposable (impôt fédéral direct) de tous les contribuables, cas normaux et spéciaux, avec et sans impôt fédéral, divisé par leur nombre ; un couple marié compte une fois. Les cas spéciaux de l'AFC (dès 2020 « Autres cas spéciaux ») sont, selon l'introduction des tableaux communaux de l'AFC : l'imposition d'après la dépense (art. 14 LIFD), les personnes sans domicile en Suisse assujetties pour une entreprise, un établissement stable ou un immeuble situé ici (art. 4–5), les personnes dont le revenu imposable et le revenu déterminant le taux diffèrent en raison de revenus étrangers (art. 7), ainsi que l'assujettissement pendant une partie de l'année (art. 40). Leur revenu imposable dans la commune peut être faible (p. ex. un seul immeuble en Suisse) ; là où ils sont nombreux, comme dans les stations aux nombreuses résidences secondaires, la moyenne de tous les cas est donc bien inférieure à celle des cas normaux. Pour comparer les revenus des habitants, utiliser la moyenne des cas normaux, qui a la même population que la médiane (2020–2023) ; cette série remonte à 2008. Le revenu imposable s'entend après déductions et diffère du salaire brut."}
