tax_np_mean_taxable_income_normal: {"label_fr": "Revenu imposable moyen par contribuable (cas normaux)", "unit_en": "CHF", "unit_de": "CHF", "unit_fr": "CHF", "description_de": "Steuerbares Einkommen (direkte Bundessteuer) der Normalfälle, geteilt durch ihre Zahl. Normalfälle (ESTV): Steuerpflichtige, die während des ganzen Steuerjahres steuerpflichtig sind, mit Wohnsitz im Kanton und ohne Auslandseinkommen, mit und ohne Bundessteuer; ein Ehepaar zählt einmal. Dieselbe Grundgesamtheit wie das mediane steuerbare Einkommen und die Einkommensklassen. Das steuerbare Einkommen ist nach Abzügen und nicht der Bruttolohn. Nur 2020–2023: die älteren ESTV-Tabellen teilen die Steuerpflichtigen ohne Bundessteuer nicht in Normal- und Sonderfälle auf. Der Mittelwert aller Fälle (ab 2008) zählt auch die Sonderfälle der ESTV mit, die ihn in Ferienorten mit vielen Zweitwohnungen senken.", "description_fr": "Revenu imposable (impôt fédéral direct) des cas normaux, divisé par leur nombre. Cas normaux (AFC) : contribuables assujettis pendant toute l'année fiscale, domiciliés dans le canton et sans revenus étrangers, avec et sans impôt fédéral ; un couple marié compte une fois. Même population que le revenu imposable médian et les classes de revenu. Le revenu imposable s'entend après déductions et diffère du salaire brut. Seulement 2020–2023 : les anciens tableaux de l'AFC ne répartissent pas les contribuables sans impôt fédéral entre cas normaux et spéciaux. La moyenne de tous les cas (dès 2008) compte aussi les cas spéciaux de l'AFC, qui la font baisser dans les stations aux nombreuses résidences secondaires."}
tax_np_mean_net_income_normal: {"label_fr": "Revenu net moyen par contribuable (cas normaux)", "unit_en": "CHF", "unit_de": "CHF", "unit_fr": "CHF", "description_de": "Reines Einkommen (direkte Bundessteuer, Art. 25 DBG: Einkommen nach den allgemeinen Abzügen, vor den Sozialabzügen für Kinder und Ehepaare, die zum steuerbaren Einkommen führen) der Normalfälle, geteilt durch ihre Zahl. Normalfälle (ESTV): Steuerpflichtige, die während des ganzen Steuerjahres steuerpflichtig sind, mit Wohnsitz im Kanton und ohne Auslandseinkommen, mit und ohne Bundessteuer; ein Ehepaar zählt einmal. Dieselbe Grundgesamtheit wie das mediane steuerbare Einkommen und die Einkommensklassen. Nur 2020–2023.", "description_fr": "Revenu net (impôt fédéral direct, art. 25 LIFD : revenu après les déductions générales, avant les déductions sociales pour enfants et couples mariés qui donnent le revenu imposable) des cas normaux, divisé par leur nombre. Cas normaux (AFC) : contribuables assujettis pendant toute l'année fiscale, domiciliés dans le canton et sans revenus étrangers, avec et sans impôt fédéral ; un couple marié compte une fois. Même population que le revenu imposable médian et les classes de revenu. Seulement 2020–2023."}
tax_np_share_no_federal_tax_normal: {"label_fr": "Part des contribuables ne payant pas d'impôt fédéral direct (cas normaux)", "unit_en": "%", "unit_de": "%", "unit_fr": "%", "description_de": "Normalfälle ohne direkte Bundessteuer (Einkommen nach Abzügen unter der Steuergrenze), in Prozent aller Normalfälle. Normalfälle (ESTV): Steuerpflichtige, die während des ganzen Steuerjahres steuerpflichtig sind, mit Wohnsitz im Kanton und ohne Auslandseinkommen, mit und ohne Bundessteuer; ein Ehepaar zählt einmal. Dieselbe Grundgesamtheit wie das mediane steuerbare Einkommen und die Einkommensklassen. Nur 2020–2023.", "description_fr": "Cas normaux ne devant pas d'impôt fédéral direct (revenu après déductions inférieur au seuil d'imposition), en pour-cent de tous les cas normaux. Cas normaux (AFC) : contribuables assujettis pendant toute l'année fiscale, domiciliés dans le canton et sans revenus étrangers, avec et sans impôt fédéral ; un couple marié compte une fois. Même population que le revenu imposable médian et les classes de revenu. Seulement 2020–2023."}
tax_np_federal_tax_per_taxpayer_normal: {"label_fr": "Impôt fédéral direct par contribuable (cas normaux)", "unit_en": "CHF", "unit_de": "CHF", "unit_fr": "CHF", "description_de": "Ertrag der direkten Bundessteuer der Normalfälle, geteilt durch die Zahl der Normalfälle, mit und ohne Bundessteuer. Normalfälle (ESTV): Steuerpflichtige, die während des ganzen Steuerjahres steuerpflichtig sind, mit Wohnsitz im Kanton und ohne Auslandseinkommen, mit und ohne Bundessteuer; ein Ehepaar zählt einmal. Dieselbe Grundgesamtheit wie das mediane steuerbare Einkommen und die Einkommensklassen. Nur 2020–2023.", "description_fr": "Rendement de l'impôt fédéral direct des cas normaux, divisé par le nombre de cas normaux, avec et sans impôt fédéral. Cas normaux (AFC) : contribuables assujettis pendant toute l'année fiscale, domiciliés dans le canton et sans revenus étrangers, avec et sans impôt fédéral ; un couple marié compte une fois. Même population que le revenu imposable médian et les classes de revenu. Seulement 2020–2023."}

